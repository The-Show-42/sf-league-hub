<style>
/* Layout: navy scoreboard masthead with gold rule and section tabs; each section is a full-width "card stock" panel; team colors carry identity. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d9dee6;
  --ink:#0f1b2d; --muted:#5b6778; --navy:#0b1f3a; --navy-2:#132b4d; --navy-ink:#ffffff; --navy-muted:#aeb9c8;
  --gold:#f2a516; --gold-ink:#1b1300; --sel:#fff4d6; --sel-line:#f2a516; --good:#2e7d32;
  --t1:#1b5e20; --t1-ink:#ffffff; --t2:#43a047; --t2-ink:#ffffff; --t3:#a5d6a7; --t3-ink:#10301a; --t4:#e8f5e9; --t4-ink:#10301a; --nr:#9aa3af;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a121e; --surface:#121d2d; --surface-2:#18263a; --line:#26364d;
  --ink:#e8edf4; --muted:#93a0b3; --navy:#050d19; --navy-2:#0e1c30; --navy-ink:#ffffff; --navy-muted:#8f9cb0;
  --gold:#f5b335; --gold-ink:#1b1300; --sel:#2e2610; --sel-line:#f5b335; --good:#66bb6a;
  --t1:#2e7d32; --t1-ink:#ffffff; --t2:#3f8f44; --t2-ink:#ffffff; --t3:#2a5a33; --t3-ink:#d9f2dc; --t4:#1b3322; --t4-ink:#cfe9d3; --nr:#6b7686;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a121e; --surface:#121d2d; --surface-2:#18263a; --line:#26364d;
  --ink:#e8edf4; --muted:#93a0b3; --navy:#050d19; --navy-2:#0e1c30; --navy-ink:#ffffff; --navy-muted:#8f9cb0;
  --gold:#f5b335; --gold-ink:#1b1300; --sel:#2e2610; --sel-line:#f5b335; --good:#66bb6a;
  --t1:#2e7d32; --t1-ink:#ffffff; --t2:#3f8f44; --t2-ink:#ffffff; --t3:#2a5a33; --t3-ink:#d9f2dc; --t4:#1b3322; --t4-ink:#cfe9d3; --nr:#6b7686;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;margin:0}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--navy);color:var(--navy-ink)}
.mast .top{padding-block:16px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px}
.eyebrow{font-family:var(--font-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--gold);margin:0}
.brand{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1;margin:2px 0 0;letter-spacing:.01em;text-transform:uppercase}
.status{font-size:13px;color:var(--navy-muted);display:flex;align-items:center;gap:8px;margin:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--navy-muted);flex:none}
.dot.live{background:#4cd964}
.tabs{background:var(--navy-2);border-bottom:4px solid var(--gold)}
.tabs nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs nav::-webkit-scrollbar{display:none}
.tabs a{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--navy-muted);padding:11px 7px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-4px}
.tabs a:hover{color:#fff}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#fff}
main{padding-block:18px 32px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin-bottom:12px}
h1,h2,h3{text-wrap:balance}
.sec-head h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4vw,34px);text-transform:uppercase;margin:0;line-height:1}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.panel-h{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.l,td.l{text-align:left}
thead th:first-child,td:first-child{padding-left:14px}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;white-space:nowrap}
td.name{white-space:normal;font-weight:600;text-align:left}
td.name span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
td.rk{font-family:var(--font-display);font-weight:700;font-size:16px;width:52px}
.k1{background:var(--t1);color:var(--t1-ink)} .k2{background:var(--t2);color:var(--t2-ink)} .k3{background:var(--t3);color:var(--t3-ink)} .k4{background:var(--t4);color:var(--t4-ink)} .kn{color:var(--nr);font-weight:600!important}
.group th{background:var(--surface);padding:12px 6px 6px 14px;text-align:left;border-bottom:2px solid var(--team,var(--gold));font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff;background:var(--team,#555);white-space:nowrap;text-decoration:none}
a.tag:hover{filter:brightness(1.15)}
.avail{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
select,input[type=search]{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:42px;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible,tr:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:grid;gap:4px;font-family:var(--font-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:9px 14px;min-height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filters .grow{flex:1 1 220px}
.filters .grow input{width:100%}
.count{font-size:13px;color:var(--muted);margin:0 0 8px}

/* Home */
.hero{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}.hero .jump{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.hero .panel{padding:16px}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,3.6vw,34px);text-transform:uppercase;margin:0 0 6px;line-height:1.05}
.hero p{margin:0 0 10px;color:var(--muted);max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{padding:10px;text-align:center;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts dt{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jump a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.jump a:hover{border-color:var(--gold)}
.latest{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.latest h2{font-family:var(--font-display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.latest ul{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:7px}.latest li{font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.latest time{font-weight:700;color:var(--muted);margin-right:6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.latest>a{font-size:13px;font-weight:700}
:root[data-theme="dark"] .dh-dn,:root[data-theme="dark"] .down,:root[data-theme="dark"] .gD,:root[data-theme="dark"] .gF{color:#ff8a7a}
:root[data-theme="dark"] .gC,:root[data-theme="dark"] .ring-part,:root[data-theme="dark"] .tx-ring,:root[data-theme="dark"] .tx-why,:root[data-theme="dark"] .hof-head .eyebrow{color:#f0b354}
.themebtn{font:inherit;font-size:12px;font-weight:700;color:var(--navy-muted);background:none;border:1px solid currentColor;border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap;margin-left:6px}.themebtn:hover{color:#fff}
.jump b{display:block;font-family:var(--font-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.jump span{font-size:13px;color:var(--muted)}
.dir td.team{text-align:left;white-space:normal}
.dir td.team a{font-weight:700;text-decoration:none}
.dir td.team a:hover{text-decoration:underline}
.dir td.team span{display:block;font-size:12px;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:28px;border-radius:3px;background:var(--team);vertical-align:middle}

/* League rosters */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.rcard header{background:var(--team);color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rcard header a{font-family:var(--font-display);font-weight:800;font-size:20px;text-transform:uppercase;text-decoration:none;color:#fff;line-height:1.1}
.rcard header a:hover{text-decoration:underline}
.rcard header span{font-size:12px;opacity:.9;white-space:nowrap}
.rcard h4{margin:0;padding:8px 12px 4px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rcard ol{list-style:none;margin:0;padding:0 0 6px}
.rcard li{display:grid;grid-template-columns:1fr auto 40px;gap:8px;align-items:center;padding:3px 12px;font-size:14px}
.rcard li .pos{font-size:12px;color:var(--muted)}
.rcard li .r{font-family:var(--font-display);font-weight:700;font-size:14px;text-align:center;border-radius:4px;padding:1px 0;font-variant-numeric:tabular-nums}

/* Team page */
.teamhead{background:var(--team);color:#fff;border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.teamhead h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,44px);text-transform:uppercase;margin:0;line-height:1}
.teamhead p{margin:4px 0 0;opacity:.92}
.teamhead select{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.teamhead select option{color:#0f1b2d;background:#fff}
.stats{display:grid;grid-template-columns:repeat(6,1fr);margin:0}
.stats div{padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats dt{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stats dd small{font-size:13px;color:var(--muted);font-weight:600}
.picks{padding:10px 14px 4px;display:grid;gap:8px}
.picks h3{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font:inherit;font-family:var(--font-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line)}
.chip .orig{color:var(--muted);font-weight:500}
.none{color:var(--muted);font-size:14px}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Trade compare */
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:8px}
.controls select{width:100%}
.swap{min-height:42px;min-width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:18px;cursor:pointer}
.finder{position:relative;margin-bottom:10px}
.finder input{width:100%}
.results{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);margin:4px 0 0;padding:4px;list-style:none;max-height:340px;overflow:auto}
.results button{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .meta{font-size:12px;color:var(--muted)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.side{display:flex;flex-direction:column}
.side-head{background:var(--team);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.side-head h2{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;margin:0;text-transform:uppercase}
.side-head p{margin:3px 0 0;font-size:13px;opacity:.9}
.side-head .slot{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.side .stats{grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.side .picks{border-bottom:1px solid var(--line)}
.side .roster{overflow:auto;max-height:560px}
tbody tr.p{cursor:pointer}
tbody tr.p:hover td:not(.rk){background:var(--surface-2)}
tr[aria-pressed="true"] td:not(.rk){background:var(--sel)}
tr[aria-pressed="true"] td.name{box-shadow:inset 4px 0 0 var(--sel-line)}
.builder{border-top:4px solid var(--gold)}
.builder-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.builder-head h2{font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0}
.builder-head p{margin:0;font-size:13px;color:var(--muted)}
.clear{font:inherit;font-weight:600;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer}
.slip{display:grid;grid-template-columns:1fr 1fr}
.slip>div{padding:12px 14px;min-width:0}
.slip>div+div{border-left:1px solid var(--line)}
.slip h3{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.slip ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
.slip li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;background:var(--surface-2);border-radius:6px;padding:5px 6px 5px 10px}
.slip li b{font-weight:600}
.slip li span{color:var(--muted);font-size:12px}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;min-width:28px;min-height:28px;border-radius:6px}
.x:hover{color:var(--ink);background:var(--line)}
.tot{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:2px 10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.tot b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.empty{padding:16px 14px;color:var(--muted);font-size:14px;margin:0}

/* Draft boards */
.board td.cell{color:#fff;background:var(--team);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;min-width:74px;border:2px solid var(--surface)}
.board td.cell.traded{box-shadow:inset 0 -4px 0 rgba(255,255,255,.55)}
.board th.col{min-width:74px;line-height:1.15}
.board th.col small{display:block;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:none;font-size:11px}
.board td.rd{font-family:var(--font-display);font-weight:700;text-align:left;white-space:nowrap}
.board td.rd small{color:var(--muted);font-weight:600;margin-left:4px}
.band{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 14px;border-bottom:1px solid var(--line)}
.own td{font-size:14px}
.own td.cap{font-family:var(--font-display);font-weight:700;font-size:17px}

/* Trade log */
.trade{padding:12px 14px;border-bottom:1px solid var(--line)}
.trade:last-child{border-bottom:0}
.trade h3{margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.trade h3 span{color:var(--muted);font-weight:600;margin-left:8px}
.trade ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.trade li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.trade li b{font-weight:600;margin-right:4px}
.dv{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 10px;white-space:nowrap;color:#fff}.dv-b{background:#1b7f3b}.dv-lb{background:#5aa469}.dv-sp{background:#7a8594}.dv-ls{background:#d9822b}.dv-s{background:#c62828}

traight weekly matchups, from the start of 2017 into 2018. Took Vladimir Guerrero Jr. first overall in 2019. Franchise icons: Mike Trout and Clayton Kershaw.","Mosby":"An original member, known to every corner of the league. For years one of the most trigger-happy traders in Showler & Friends, he has made {trades} deals and counting, though the philosophy has mellowed with age. When a deal is ready, you'll hear the battle cry: \"Pull it!\" Plucked Corbin Carroll off waivers in 2023. Franchise MVP: Mookie Betts. He has made the playoffs {trips} times in {seasons} seasons and is still hunting the first ring.","Justin":"An original member, with every one of the league's {seasons} seasons on his ledger. Runner-up {runnerup} times, he has stood one week away from the ring. Found Anthony Rizzo in the 12th round of the 2014 draft and rode Miguel Cabrera to the franchise's greatest seasons. A connoisseur of Toaster Scramblers and a firm believer in pitching to Pujols. A Cubs fan, which explains a great deal about his patience.","John":"\"Sexy.\" An original member and a back-to-back champion, crowned in 2011 and again in 2012. Then came the plunge: the only man to go from first to worst in back-to-back years. No one deals more; {trades} trades{mostTrades}. Drafted Matt Carpenter in the 13th round of 2013, and Carpenter became his franchise MVP. His negotiating doctrine is two lines long: \"Talk to me when you're serious\" and \"Ha, not! Lmfao.\"","Doug":"The Big Red Machine, in the league since 2010. He loves to play and loves to trade, chasing prominent prospects in hopes of significant returns and stockpiling relief pitchers along the way. The league crowned him \"Worst Trade Offers,\" and he answered in 2023 by winning the title from the No. 6 seed, the last team in the bracket. Struck gold with Austin Riley in the 21st round of the 2021 draft. Franchise MVP: Xander Bogaerts.","Carter":"The youngest member in league history: he joined in 2011 at 14 years old. {seasons} seasons later he is one of the league's sharpest waiver-wire hunters. His drafts produced Jacob deGrom in the 11th round of 2015. He was born to be John Stonebarger's arch nemesis, and the weekly ledger between them reads {h2h:John} in Carter's favor.","Morgan":"\"Big Sweata,\" a member since 2011 and a fixture of October with {trips} playoff trips. He took Ronald Acuña Jr. third overall in the 2018 draft, and Acuña became the face of the franchise. Tireless advocate for Andruw Jones in Cooperstown. Holds a grudge against starting pitchers so deep that he once released every one of them.","Guy":"\"G Money,\" a member since 2011, and the man the league named \"Hardest to trade with.\" His 2014 title run belongs in the museum: Melky Cabrera, J.D. Martinez and Josh Harrison off the waiver wire, a three-round sweep, and a championship game that ended dead even at 8-8-2 before the tiebreaker crowned him. Franchise MVP: Manny Machado.","Travis":"\"TravDaddy,\" a member since 2013 and one of the finest managers the league has known. Three-time champion, back to back in 2016 and 2017, then again in 2021, when he ripped off ten straight weekly wins. A true believer in the strong pitching staff, built around Max Scherzer. His masterpiece: Trea Turner in the 23rd round of the 2016 draft.","Preston":"A member since 2013 and one of the league's two Oregon outposts. Champion in 2022, with Julio Rodríguez on the roster as his NA keeper; runner-up {runnerup} times besides. He has one regular-season first-place finish and {trips} playoff trips. He is also the creator of MATL, and more rings are on the way.","Micah":"\"Big Mike,\" a baseball lifer who lives for the fantasy game. He makes the trades that get him called ignorant, then wins the league. In February 2018 he landed Christian Yelich, J.D. Martinez and Anthony Rendon in a three-team blockbuster. That fall, in only his third season, he swept three playoff rounds and was champion. Weekly ledger against Justin: {h2h:Justin}.","Paul":"The Oregon newcomer, who took over a franchise in Week 20 of 2024. He eats and breathes baseball and hardly misses a Brewers game. When he isn't watching, he's listening to a fantasy podcast or playing MLB The Show. Already a menace on the waiver wire, and his franchise MVP so far is, fittingly, a Brewer: Brice Turang. GOAT PAUL."},"fb":{"Show":"benshowler","Mosby":"jacob.mosby","Justin":"justin.stonebarger","John":"jcstonebarger","Doug":"Douglas.Simmons.80","Carter":"brettman09","Morgan":"brett.morgan.37","Guy":"guy.c.swift","Travis":"Travdaddy420","Preston":"preston.devine","Micah":"micahwade121110","Paul":"paul.hilbun.1"},"former":[["Trent Ellick","An original member in 2009, he stepped away until 2014, when he returned to play an important role until 2024. He then stepped away to finish his nursing schooling."],["Cal Swift","Managed the \"Team Goons\" for five seasons, starting in 2011. He was the original owner of Mike Trout."],["Bryson Atkins","He managed for a brief period in 2014."],["Carter Barless","He managed for the beginning months of 2014."],["T.L. Murdock","He managed a team in the 2012 season called the \"Tomahawk Braves.\""],["Waterboy","He managed a team for two seasons in 2011-12 called the \"Waterboy Twins.\""],["Kimberly Morgan","She managed a team in the 2011 season called \"Cardinals Girl.\""],["Tyler Olden","He managed a team for four seasons from 2010-13. The team name was \"Red Shirt All-Stars.\" Massive fan of baseball and the Texas Rangers."],["Josh \"Pete\" England","He managed for a year and a half from 2010-11. His team name was \"petes punishers.\""],["Tommy Kinzer","He managed for 1 season in 2010."],["Bob \"Pops\" Showler","One of the originals and the reason the league was named \"Showler & Friends,\" Pop's managed for three seasons from 2009-11. Known around the league as \"No trade Pops,\" he never made one trade the whole time he played. Finished runner-up in the first year of the league."],["Hazen Hale","One of the originals, he managed for two seasons from 2009-10. His team name was \"Bravesfan.\""],["Wesley Schrick","One of the originals, he managed a team for two seasons from 2009-10. His team was named \"the schricks.\""],["Zach Randolph","One of the originals, he managed for two seasons from 2009-10. His team name was \"smallz,\" owning the first season's best record."],["Chad Scheilz","One of the originals, he managed for 1 season in 2009. His team name was the \"Oklahoma Chadaliacs.\""],["Zach Michel","One of the originals, he managed for 1 season in 2009. His team name was the \"Zichel.\""],["Kent Israel","One of the originals, he managed for 1 season in 2009. His team name was \"Izzy's Elite Team.\""]],"history":["The Showler and Friends Fantasy Baseball League was created in 2009. It started as a casual, fun league with friends; it quickly evolved into a competitive keeper league. Beginning with six keepers going into the 2010 season, each manager now keeps eight players from their squad, which started in 2011.","Most of the league's managers are from Oklahoma, with two residing in Oregon. The league does not play for money but rather the right to boast in whatever way the manager feels the need.","This league uses Yahoo Fantasy Baseball, which the commish found as the best site for fantasy sports. From the league opening date in late January to the close in October, the league uses the Yahoo site to play the game. The league, however, doesn't stop there. Starting December 1st, the managers will take their final rosters and prepare for the Off-Season. During the Off-Season, managers may trade from their final roster and draft picks in the next year's draft. This is where the managers build their rosters and use their philosophy to prepare for the following year or years based on the players obtained.","Each year, the league holds a fantasy meeting to discuss trades, talk strategies, and hold the division draft, with the top three teams picking who will be in their division const DESK = {"note":"The Hot Take Desk: five made-up commentators. Every number in a take must be real. @{Key} marks a manager. A take is [commentator, text, heat 1-5]. trades.takes is keyed by the Trade Log's Trade # for the off-season in trades.season; pick is the index of the take printed on the TRADE ALERT graphic.","cast":{"F":{"name":"“Furnace” Frank Delvecchio","short":"Furnace Frank","role":"The spicy one","color":"#c62828","ini":"FD","bio":"Yells about everything. Has never been wrong, according to him.","pic":"img/desk/F.jpg?v=e11803bc","long":["Frank has called S&F games since the league's first Yahoo draft in 2009, and by his count he has been right about every single one. He has not.","He grades trades with his whole chest. A 20 is an insult to his family. A 4 is a crime scene. Anything over 90 gets a standing ovation from the only person in the studio, which is Frank.","Off the air, he still has the 2013 Billy Butler trade printed and taped to his dashboard. He reads it at red lights. \"For motivation,\" he says."]},"P":{"name":"The Professor","short":"The Professor","role":"Trades and drafts","color":"#1e4e8c","ini":"PR","bio":"Buries you with your own numbers.","pic":"img/desk/P.jpg?v=f94faf61","long":["The Professor does not raise his voice. He raises a spreadsheet. He has value points for every player since 2009 and he will read them to you, slowly, until you agree with him.","His favorite thing in the world is a trade that looks fair and is not. His second favorite is explaining why, using the word \"marginal\" at least four times.","He has never once been asked to the cookout. He has a theory about why, and it has a regression line."]},"S":{"name":"Coach Skip","short":"Coach Skip","role":"Weekly matchups","color":"#2e7d32","ini":"CS","bio":"Hates spreadsheets. Thinks you lost because you did not want it.","pic":"img/desk/S.jpg?v=8eb4771e","long":["Coach Skip played a little, coached a lot, and trusts none of it that comes on a computer. Value points? He's got two: did you want it, and did you show up.","He covers the weekly matchups, which means he spends Monday mornings telling the losers they lost because they did not want it bad enough. The math says otherwise. Skip says the math wasn't there.","He keeps sunflower seeds in every jacket he owns and has spit shells at three different producers."]},"D":{"name":"Dee from the Waiver Wire","short":"Dee","role":"Adds and drops","color":"#8e24aa","ini":"DW","bio":"Treats every drop like a breakup.","pic":"img/desk/D.jpg?v=94411b4d","long":["Dee lives on the waiver wire. Every add is a first date, every drop is a breakup, and every guy who gets cut and goes on a heater is the one that got away.","She has a box of tissues on the desk at all times and has needed it for nearly every Monday since 2009. She is still not over Todd Helton going unclaimed in 2009.","Her advice to every manager is the same: \"Go back and check the wire. Somebody good is out there waiting for you.\""]},"I":{"name":"The Intern","short":"The Intern","role":"Wild card","color":"#b26a00","ini":"IN","bio":"Terrified of Frank. Says the meanest thing by accident.","pic":"img/desk/I.jpg?v=2407a7f3","long":["The Intern got the job because nobody else answered the posting. He fetches Frank's coffee, holds Skip's seeds and reads the numbers off the cards the Professor hands him.","He is scared of Frank, scared of the managers and a little scared of the Professor's spreadsheets. He is so nervous that the meanest thing said on the desk each week usually comes out of his mouth, by accident, in the nicest voice possible.","He would like everyone to know he is very sorry, and also that the grade really was a 2."]}},"trades":{"season":2027,"takes":{},"past":{}},"segments":[{"id":"power-2027","title":"The 2027 power rankings drop","sub":"Before keepers and the draft","takes":[["F","@{Show} won it all in 2026 and the projections put him 19.7 points clear of everybody for 2027. Juan Soto, Shohei Ohtani, Junior Caminero, Fernando Tatis Jr., Vladimir Guerrero Jr. That is not a keeper core. That is an ALL-STAR BALLOT!",5],["P","@{Carter} finished second in 2026. His eight best keepers project to 56.4 value points, eighth in the league, and the best of them is Ben Rice at 10.1. The standings remember 2026. The projections do not.",4],["S","@{Justin} went from 11th to 7th without playing a game. James Wood and Pete Crow-Armstrong, young legs. I like it. Now go win something.",2],["D","@{Paul} is 12th of 12, and his best keeper is Steven Kwan at 9.2. Honey, Kwan is lovely, but he is not carrying a franchise. The trade window opens December 1.",4],["I","Um, every team's draft picks are worth between 36.5 and 36.8 right now, because nobody has traded yet. So this whole list is just keepers? Sorry, Frank.",3]],"kind":"news"},{"id":"receipts-2017-03-18","title":"Receipts · the trade file","sub":"March 18, 2017","takes":[["P","March 18, 2017. @{Preston} sends Charlie Blackmon and a round 11 pick to @{Travis} for Matt Kemp, Jake Lamb and a round 9 pick. Our trade grades: Travis 99, Preston 1. There is no grade below 1. We checked.",4],["F","ONE! Out of a HUNDRED! You moved up two rounds in the draft and handed the man a title! @{Travis} won the championship that year, and he should have sent @{Preston} a ring and a fruit basket.",5],["S","Kemp was a ballplayer. I liked the trade at the time. I still like it. I do not read the grades.",1]],"kind":"vault"},{"id":"waiver-perdomo","title":"Dee’s Waiver Wire","sub":"The one that got away","takes":[["D","March 31, 2025: eleven managers looked at Geraldo Perdomo on the wire and swiped left. @{Preston} picked him up and got 17.0 value points, the best free-agent add in league history. Eleven of you fumbled the love of your lives.",3],["I","So the same guy made the trade that graded a 1 and the best pickup ever? I do not know how to feel about him.",2]],"kind":"vault"}],"hotseat":{"title":"Frank’s Hot Seat","sub":"Who he is angriest at · Week 22, 2026","rows":[["Justin","Would have lost to all 11 teams in Week 22. Missed the innings minimum by one out. Lost 15-3."],["Mosby","A 6.17 ERA with the season on the line. Out of the playoffs by two category wins."],["Travis","Clinched, then threw 27 innings and lost 14-4 to a team that finished eighth."],["Show","Won 12-5 with a 5.00 ERA. Frank calls this “stealing.”"],["Morgan","Lost 14-2 to Guy in the game that decided sixth place."]]}};
const dkTxt = (t, plain) => esc(t).replace(/@\{([^}]+)\}/g, (_, k) => plain ? `<span class="tag" style="--team:${T[k] ? T[k].color : "var(--muted)"}">${esc(k.replace(/^~/, ""))}</span>` : who(k));
const dkFace = (c, big) => DESK.cast[c].pic ? `<img class="dk-f${big ? " big" : ""}" src="${DESK.cast[c].pic}" alt="${esc(DESK.cast[c].name)}" style="--c:${DESK.cast[c].color}">` : `<span class="dk-f${big ? " big" : ""}" style="background:${DESK.cast[c].color}">${DESK.cast[c].ini}</span>`;
// the cast card pop-up: big portrait and the full bio
const dkCastPop = c => { const x = DESK.cast[c]; return `<div class="dk-pop" style="--c:${x.color}">${x.pic ? `<img src="${x.pic}" alt="${esc(x.name)}">` : ""}<div><span class="r">${esc(x.role)}</span><h3>${esc(x.name)}</h3><p class="dk-pop-b">${esc(x.bio)}</p>${(x.long || []).map(t => `<p>${esc(t)}</p>`).join("")}<p class="dk-pop-n">The Hot Take Desk is made up. Every number the cast quotes is real.</p></div></div>`; };
const dkTake = ([c, t, h], pick) => `<div class="dk-t" style="--c:${DESK.cast[c].color}">${dkFace(c)}<div><p class="dk-w"><b>${esc(DESK.cast[c].name)}</b><span class="dk-h" title="Heat ${h} of 5">${[0, 1, 2, 3, 4].map(i => `<i${i < h ? ' class="on"' : ""}></i>`).join("")}</span>${pick ? `<span class="dk-pk">On the trade alert</span>` : ""}</p><p class="dk-q">${dkTxt(t)}</p></div></div>`;
// under a trade in the Trade Log: the desk's reaction to that trade
// the Hot Take Desk's reaction to a trade, matched by season, date and the managers involved (current off-season or archived)
function deskForTrade(t){
  const ms = t[2].map(x => String(x[0])).sort().join("|"), all = [];
  if (DESK.trades.season == t[0]) Object.entries(DESK.trades.takes || {}).forEach(([n, r]) => all.push([n, r]));
  Object.entries((DESK.trades.past || {})[t[0]] || {}).forEach(([n, r]) => all.push([n, r]));
  const hit = all.find(([n, r]) => r.date === t[1] && (r.mgrs || []).slice().sort().join("|") === ms);
  return hit ? `<div class="dk-seg in"><h3>The Hot Take Desk <span>Breaking: Trade ${esc(hit[0])}</span></h3>${hit[1].takes.map((x, i) => dkTake(x, i === hit[1].pick)).join("")}</div>` : "";
}
function deskBox(num){
  const R = (DESK.trades.takes || {})[String(num || "").trim()];
  if (!R || !R.takes || !R.takes.length) return "";
  return `<div class="dk-seg in"><h3>The Hot Take Desk <span>Breaking: Trade ${esc(num)}</span></h3>${R.takes.map((t, i) => dkTake(t, i === R.pick)).join("")}</div>`;
}
// Home: one take a day, rotating through the hottest takes on the desk
function deskTeaser(){
  const tk = DESK.trades.takes || {}, recent = Object.keys(tk).sort((a, b) => b - a).slice(0, 3).flatMap(n => tk[n].takes);
  const news = DESK.segments.find(g => g.kind !== "vault"), vault = DESK.segments.find(g => g.kind === "vault");
  const cur = [...(news ? news.takes : []), ...recent, ...(vault ? vault.takes : [])], pool = cur.filter(t => t[2] >= 4).length ? cur.filter(t => t[2] >= 4) : cur; if (!pool.length) return "";   // only what's on the air now
  const [y, m, d] = new Date().toLocaleDateString("en-CA", { timeZone: "America/Chicago" }).split("-").map(Number), n = Math.floor(Date.UTC(y, m - 1, d) / 864e5), t = pool[n % pool.length];
  return `<a class="dk-tz" href="#desk">${dkFace(t[0], true)}<p><span class="dk-lab">Take of the day</span>&ldquo;${dkTxt(t[1], true)}&rdquo;<small>${esc(DESK.cast[t[0]].short)} &middot; Open The Hot Take Desk &rarr;</small></p></a>`;
}
function vDesk(){
  const seg = g => `<div data-shotwrap><section class="dk-seg" data-shot><h3>${esc(g.title)} <span>${esc(g.sub || "")}</span></h3>${g.takes.map(t => dkTake(t)).join("")}${g.verdict ? `<div class="dk-v"><b>${esc(g.verdict[0])}:</b> ${dkTxt(g.verdict[1])}</div>` : ""}</section><p class="dk-sv">${saveBtn(`SF-Hot-Take-Desk-${g.id}.png`, "desk")}</p></div>`;
  const H = DESK.hotseat, tk = DESK.trades.takes || {}, nums = Object.keys(tk).sort((a, b) => b - a);
  const NEWS = DESK.segments.find(g => g.kind !== "vault"), VAULT = DESK.segments.filter(g => g.kind === "vault");
  const trSeg = n => `<div data-shotwrap><section class="dk-seg" data-shot><h3>Breaking: Trade ${esc(n)} <span>${DESK.trades.season - 1}-${String(DESK.trades.season).slice(2)} off-season</span></h3>${tk[n].takes.map((t, i) => dkTake(t, i === tk[n].pick)).join("")}</section><p class="dk-sv">${saveBtn(`SF-Hot-Take-Desk-Trade-${n}.png`, "desk")}</p></div>`;
  return `<div class="sec-head"><div><h1>The Hot Take Desk</h1><p>Five made-up commentators talking trash about real S&amp;F results. The people are invented; every number is real.</p></div></div>
    <div class="dk-cast">${Object.keys(DESK.cast).map(c => { const x = DESK.cast[c]; return `<button type="button" class="dk-c" data-dkc="${c}" style="--c:${x.color}" aria-label="More about ${esc(x.name)}">${dkFace(c)}<b>${esc(x.name)}</b><span class="r">${esc(x.role)}</span><span>${esc(x.bio)}</span></button>`; }).join("")}</div>
    ${NEWS ? seg(NEWS) : ""}
    ${nums.slice(0, 3).map(trSeg).join("")}
    ${H ? `<div data-shotwrap><section class="dk-seg" data-shot><h3>${esc(H.title)} <span>${esc(H.sub)}</span></h3><ol class="dk-hs">${H.rows.map(([k, t], i) => `<li><span class="n">${i + 1}</span>${tag(k)}<span>${esc(t)}</span></li>`).join("")}</ol></section><p class="dk-sv">${saveBtn("SF-Hot-Take-Desk-Hot-Seat.png", "desk")}</p></div>` : ""}
    ${VAULT.length ? `<h2 class="dk-vh">From the Vault <span>league history that doesn't go stale</span></h2>${seg(VAULT[0])}${VAULT.length > 1 ? `<details class="dk-arch"><summary>More from the Vault &middot; ${VAULT.length - 1}</summary>${VAULT.slice(1).map(seg).join("")}</details>` : ""}` : ""}
    <p class="foot">The red bars are each take's heat, 1 to 5. The newest segment and the three latest trades lead the page, and each trade's takes stay with that trade in the Trade Log and Trade History. From the Vault is league history, and it stays. A new segment airs every Monday in season, and the desk breaks in whenever a trade is logged; one take from each trade goes on that trade's alert.</p>`;
}

verall in 2019. Franchise icons: Mike Trout and Clayton Kershaw.","Mosby":"An original member, known to every corner of the league. For years one of the most trigger-happy traders in Showler & Friends, he has made {trades} deals and counting, though the philosophy has mellowed with age. When a deal is ready, you'll hear the battle cry: \"Pull it!\" Plucked Corbin Carroll off waivers in 2023. Franchise MVP: Mookie Betts. He has made the playoffs {trips} times in {seasons} seasons and is still hunting the first ring.","Justin":"An original member, with every one of the league's {seasons} seasons on his ledger. Runner-up {runnerup} times, he has stood one week away from the ring. Found Anthony Rizzo in the 12th round of the 2014 draft and rode Miguel Cabrera to the franchise's greatest seasons. A connoisseur of Toaster Scramblers and a firm believer in pitching to Pujols. A Cubs fan, which explains a great deal about his patience.","John":"\"Sexy.\" An original member and a back-to-back champion, crowned in 2011 and again in 2012. Then came the plunge: the only man to go from first to worst in back-to-back years. No one deals more; {trades} trades{mostTrades}. Drafted Matt Carpenter in the 13th round of 2013, and Carpenter became his franchise MVP. His negotiating doctrine is two lines long: \"Talk to me when you're serious\" and \"Ha, not! Lmfao.\"","Doug":"The Big Red Machine, in the league since 2010. He loves to play and loves to trade, chasing prominent prospects in hopes of significant returns and stockpiling relief pitchers along the way. The league crowned him \"Worst Trade Offers,\" and he answered in 2023 by winning the title from the No. 6 seed, the last team in the bracket. Struck gold with Austin Riley in the 21st round of the 2021 draft. Franchise MVP: Xander Bogaerts.","Carter":"The youngest member in league history: he joined in 2011 at 14 years old. {seasons} seasons later he is one of the league's sharpest waiver-wire hunters. His drafts produced Jacob deGrom in the 11th round of 2015. He was born to be John Stonebarger's arch nemesis, and the weekly ledger between them reads {h2h:John} in Carter's favor.","Morgan":"\"Big Sweata,\" a member since 2011 and a fixture of October with {trips} playoff trips. He took Ronald Acuña Jr. third overall in the 2018 draft, and Acuña became the face of the franchise. Tireless advocate for Andruw Jones in Cooperstown. Holds a grudge against starting pitchers so deep that he once released every one of them.","Guy":"\"G Money,\" a member since 2011, and the man the league named \"Hardest to trade with.\" His 2014 title run belongs in the museum: Melky Cabrera, J.D. Martinez and Josh Harrison off the waiver wire, a three-round sweep, and a championship game that ended dead even at 8-8-2 before the tiebreaker crowned him. Franchise MVP: Manny Machado.","Travis":"\"TravDaddy,\" a member since 2013 and one of the finest managers the league has known. Three-time champion, back to back in 2016 and 2017, then again in 2021, when he ripped off ten straight weekly wins. A true believer in the strong pitching staff, built around Max Scherzer. His masterpiece: Trea Turner in the 23rd round of the 2016 draft.","Preston":"A member since 2013 and one of the league's two Oregon outposts. Champion in 2022, with Julio Rodríguez on the roster as his NA keeper; runner-up {runnerup} times besides. He has one regular-season first-place finish and {trips} playoff trips. He is also the creator of MATL, and more rings are on the way.","Micah":"\"Big Mike,\" a baseball lifer who lives for the fantasy game. He makes the trades that get him called ignorant, then wins the league. In February 2018 he landed Christian Yelich, J.D. Martinez and Anthony Rendon in a three-team blockbuster. That fall, in only his third season, he swept three playoff rounds and was champion. Weekly ledger against Justin: {h2h:Justin}.","Paul":"The Oregon newcomer, who took over a franchise in Week 20 of 2024. He eats and breathes baseball and hardly misses a Brewers game. When he isn't watching, he's listening to a fantasy podcast or playing MLB The Show. Already a menace on the waiver wire, and his franchise MVP so far is, fittingly, a Brewer: Brice Turang. GOAT PAUL."},"fb":{"Show":"benshowler","Mosby":"jacob.mosby","Justin":"justin.stonebarger","John":"jcstonebarger","Doug":"Douglas.Simmons.80","Carter":"brettman09","Morgan":"brett.morgan.37","Guy":"guy.c.swift","Travis":"Travdaddy420","Preston":"preston.devine","Micah":"micahwade121110","Paul":"paul.hilbun.1"},"former":[["Trent Ellick","An original member in 2009, he stepped away until 2014, when he returned to play an important role until 2024. He then stepped away to finish his nursing schooling."],["Cal Swift","Managed the \"Team Goons\" for five seasons, starting in 2011. He was the original owner of Mike Trout."],["Bryson Atkins","He managed for a brief period in 2014."],["Carter Barless","He managed for the beginning months of 2014."],["T.L. Murdock","He managed a team in the 2012 season called the \"Tomahawk Braves.\""],["Waterboy","He managed a team for two seasons in 2011-12 called the \"Waterboy Twins.\""],["Kimberly Morgan","She managed a team in the 2011 season called \"Cardinals Girl.\""],["Tyler Olden","He managed a team for four seasons from 2010-13. The team name was \"Red Shirt All-Stars.\" Massive fan of baseball and the Texas Rangers."],["Josh \"Pete\" England","He managed for a year and a half from 2010-11. His team name was \"petes punishers.\""],["Tommy Kinzer","He managed for 1 season in 2010."],["Bob \"Pops\" Showler","One of the originals and the reason the league was named \"Showler & Friends,\" Pop's managed for three seasons from 2009-11. Known around the league as \"No trade Pops,\" he never made one trade the whole time he played. Finished runner-up in the first year of the league."],["Hazen Hale","One of the originals, he managed for two seasons from 2009-10. His team name was \"Bravesfan.\""],["Wesley Schrick","One of the originals, he managed a team for two seasons from 2009-10. His team was named \"the schricks.\""],["Zach Randolph","One of the originals, he managed for two seasons from 2009-10. His team name was \"smallz,\" owning the first season's best record."],["Chad Scheilz","One of the originals, he managed for 1 season in 2009. His team name was the \"Oklahoma Chadaliacs.\""],["Zach Michel","One of the originals, he managed for 1 season in 2009. His team name was the \"Zichel.\""],["Kent Israel","One of the originals, he managed for 1 season in 2009. His team name was \"Izzy's Elite Team.\""]],"history":["The Showler and Friends Fantasy Baseball League was created in 2009. It started as a casual, fun league with friends; it quickly evolved into a competitive keeper league. Beginning with six keepers going into the 2010 season, each manager now keeps eight players from their squad, which started in 2011.","Most of the league's managers are from Oklahoma, with two residing in Oregon. The league does not play for money but rather the right to boast in whatever way the manager feels the need.","This league uses Yahoo Fantasy Baseball, which the commish found as the best site for fantasy sports. From the league opening date in late January to the close in October, the league uses the Yahoo site to play the game. The league, however, doesn't stop there. Starting December 1st, the managers will take their final rosters and prepare for the Off-Season. During the Off-Season, managers may trade from their final roster and draft picks in the next year's draft. This is where the managers build their rosters and use their philosophy to prepare for the following year or years based on the players obtained.","Each year, the league holds a fantasy meeting to discuss trades, talk strategies, and hold the division draft, with the top three teams picking who will be in their division for the upcoming season. The suggestion committee will also release their rulings on the suggestions from the league."],"resources":[["ESPN Fantasy Baseball","https://www.espn.com/fantasy/baseball/"],["RotoWire","https://www.rotowire.com/baseball/"],["CBS Sports Fantasy Baseball","https://www.cbssports.com/fantasy/baseball/"],["MLB.com Fantasy","http://mlb.mlb.com/mlb/fantasy/?tcid=nav_mlb_fantasy"],["Fantasy Alarm","http://www.fantasyalarm.com/mlb/"],["FantasyRundown","http://fantasyrundown.com/"],["RotoChamp","http://rotochamp.com/"],["FOX Sports Fantasy Baseball","http://www.foxsports.com/fantasy/baseball/commissioner/"],["MLB Scores","https://www.mlb.com/scores"],["FantasyPros Dynasty Rankings","https://www.fantasypros.com/mlb/rankings/dynasty-overall.php"]],"links":{"yahoo":"https://baseball.fantasysports.yahoo.com/b1/8136","facebook":"https://www.facebook.com/groups/ShowlerandFriendsFantasyBaseball/","drive":"https://drive.google.com/drive/folders/0B2Kd23yX1pi7VXVUbHJOOE80NVk?usp=sharing","scores":"https://www.mlb.com/scores","sheet":"https://docs.google.com/spreadsheets/d/165AFWE7ohpvJEgKYvBFfIOZ0w5-Fi7PIVgfMJzDnW-o/edit","boards":"https://docs.google.com/spreadsheets/d/1jJSvDw4luHokcYqdh3yGmH566i12vvcxFKze8JdX9to/edit"}};

      <p class="dropcap">In 2009 a group of friends opened a Yahoo league and put a name on it: Showler &amp; Friends. It was meant to be casual. It did not stay that way. By the 2010 season every manager was carrying six keepers into the new year, and since 2011 the number has stood at eight&mdash;eight names a man is willing to stake his whole winter on.</p>
      <p>There is no purse, and there never has been. The league plays for the oldest prize in the game: the right to talk about it. Its members are Oklahomans for the most part, with two keeping the faith from Oregon, and the arguments carry just fine across the distance.</p>
      <p>The season is played on Yahoo, from the league's opening in late January to the last out in October. Then, on December 1, the off-season begins. Final rosters become the raw material of the winter. Managers trade players and the next year's draft picks, and each one builds by his own philosophy&mdash;for the season ahead, or for the seasons after it.</p>
      <p>Every year the league convenes its fantasy meeting. Trades are argued over, strategies are laid bare, and the division draft is held, the top three finishers choosing who will share their division. The suggestion committee hands down its rulings there as well, and the league's law grows a little older and a little wiser.</p>
    </section>
    <section class="panel"><h2 class="panel-h">The Champions' Gallery <span class="hint">tap a plaque for the run and the roster</span></h2>
      <div class="plaques">${cy.map(([y, k]) => `<button type="button" class="plaque" data-champ="${y}" style="--team:${T[k] ? T[k].color : "#555"}" aria-label="${y} champion ${own(k)}: the run and the roster"><span class="py">${y}</span><span class="pc">Champion</span><b>${own(k)}</b><span class="pn">${ordw(nth[y])[0].toUpperCase() + ordw(nth[y]).slice(1)} title</span></button>`).join("")}</div></section>
    <section class="panel"><h2 class="panel-h">Distinctions</h2><dl class="hof-dl">
      <div><dt>Most championships</dt><dd><b>${own(lead[0])}</b>, ${lead[1]} titles${ranked[1] ? `. Next: ${ranked.slice(1).filter(r => r[1] === ranked[1][1]).map(r => own(r[0])).join(" and ")}, ${ranked[1][1]}.` : "."}</dd></div>
      ${best ? `<div><dt>Longest title run</dt><dd><b>${own(best.k)}</b>, ${best.n} straight (${best.from}&ndash;${best.to})${multi.length > 1 ? `. Also repeated: ${multi.slice(1).map(r => `${own(r.k)} ${r.from}&ndash;${r.to}`).join(", ")}.` : "."}</dd></div>` : ""}
      <div><dt>The trophy's owners</dt><dd>${ranked.map(([k, n]) => `<span class="pill gold">${own(k)} &times;${n}</span>`).join(" ")}</dd></div>
      ${ru.length ? `<div><dt>So close</dt><dd><b>${own(ru[0][0])}</b> has finished runner-up ${ru[0][1].runnerup} time${ru[0][1].runnerup === 1 ? "" : "s"}, the most in league history.</dd></div>` : ""}
      <div><dt>First champion</dt><dd><b>${own(asc[0][1])}</b>, ${asc[0][0]}</dd></div></dl>
      <p class="foot pad">Championship seasons 2009&ndash;${asc[asc.length - 1][0]}. 2020 is not counted in league records.</p></section>
    <section class="panel"><h2 class="panel-h">The Ledger &middot; career records of active managers</h2><div class="scroll"><table><thead><tr><th class="l">Manager</th><th>Seasons</th><th>Regular season</th><th>Win %</th><th>Playoff trips</th><th>Playoff record</th><th>Titles</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="l">${tag(r.k)} <a href="#manager-${r.k.toLowerCase()}" style="font-weight:600">${esc(T[r.k].owner)}</a></td><td>${r.cr.n} <small style="color:var(--muted)">(${r.cr.first === r.cr.last ? r.cr.first : r.cr.first + "&ndash;" + r.cr.last})</small></td><td>${r.cr.W}-${r.cr.L}-${r.cr.T}</td><td class="pct">${r.cr.pct}</td><td>${r.cr.c.playoffs.length}</td><td>${r.cr.pW}-${r.cr.pL}-${r.cr.pT}</td><td class="pct">${r.cr.c.champs.length || "&mdash;"}</td></tr>`).join("")}</tbody></table></div>
      <p class="foot pad">Records are category wins, losses and ties. Win % counts a tie as half a win.</p></section>
  </div>`;

const RULES = {"adopted":"Compiled November 2026 from league records, 2012–2026","preamble":"We, the managers of the Showler & Friends Fantasy Baseball League, founded in 2009 as a keeper league among friends and family, adopt these rules so that every manager plays the same game, every trade is handled the same way, and every season is decided on the field. Where these rules are silent, the Commissioner decides.","articles":[{"n":"I","t":"The League","s":[["1.1","Name","The league is the Showler & Friends Fantasy Baseball League (“S&F” or “the League”), hosted on Yahoo Fantasy Baseball as “S&F Baseball.”",["2012-04-12"]],["1.2","Membership","The League consists of twelve (12) managers, each holding one franchise.",["2014-07-31"]],["1.3","Free league","The League is a free league. No entry fee is collected and no prize money is paid. A February 2022 proposal to make S&F a money league received 7 votes for and 4 against and was not adopted; the League remained free.",["2022-02-19","2022-02-24"]],["1.4","Official channels","League announcements, off-season trades, and votes are posted in the S&F Baseball Facebook group. The league website and the off-season rosters and draft boards it links to are the League’s record between seasons. Every manager is expected to follow the Facebook group.",["2013-10-01","2015-01-21","2024-12-26"]]]},{"n":"II","t":"Managers","s":[["2.1","Duties","Each manager shall check and set his lineup, make roster moves, be available for trade talks, and respond when contacted. A manager who can no longer meet these duties shall tell the Commissioner, who will find a replacement and may place the departing manager on a list for re-entry.",["2014-07-21","2024-07-29"]],["2.2","Notice of resignation","A manager who intends to leave the League must notify the Commissioner before December 1 so a replacement can be in place before the off-season opens.",["2015-10-04","2016-10-03"]],["2.3","Removal for inactivity","A franchise left unattended may be reassigned by the Commissioner to a new manager during the season. The first such reassignment took place in July 2014.",["2014-07-21"]],["2.4","Retention vote (the “3–3 Rule”)","(a) A manager who finishes in the bottom three of the final regular-season standings in three consecutive seasons is placed before the League for a retention vote.\n(b) Before the vote the Commissioner contacts the manager to confirm he wishes to continue. Each voting manager is then contacted privately; individual votes are confidential and only the totals are announced.\n(c) The manager in question, the Commissioner, and any manager in his first season do not vote. A majority of the votes cast for removal removes the manager.\n(d) A manager who is retained faces a new vote after each later season in which he again finishes in the bottom three. A finish outside the bottom three resets his count to zero.\n(e) The Commissioner announces at the start of a season which managers are in an evaluation year.",["2018-12-16","2021-09-13","2023-03-29","2023-10-02","2024-03-02","2024-10-09"]],["2.5","Co-managers","A manager may add a co-manager, subject to these conditions: (a) the co-manager is not added to the Facebook group or the league website; (b) all trade negotiations go through the head manager, and a co-manager who negotiates trades outside Yahoo is removed; (c) the co-manager may make transactions and send trade offers on Yahoo; (d) the Commissioner may remove a co-manager at any time.",["2021-02-21"]]]},{"n":"III","t":"The Commissioner and Rulemaking","s":[["3.1","Authority","The Commissioner administers the League, enters keepers and off-season trades, sets the schedule and deadlines, and rules on every question these rules do not answer. Final decisions rest with the Commissioner.",["2014-07-31","2019-11-01"]],["3.2","Recommendations","Any manager may propose a rule change. The Commissioner posts each recommendation to the Facebook group for discussion and, where he judges it warranted, a league vote. The Commissioner makes the final decision.",["2019-11-01","2022-07-20"]],["3.3","When changes take effect","A rule change adopted during a season takes effect the following season or off-season unless the vote states that it takes effect immediately. Disputes over existing rules are raised privately with the Commissioner during the off-season, not in public during the season.",["2014-07-31","2022-07-20"]],["3.4","Duty to verify","Each manager shall check his roster and draft board after every posted trade and before each draft, and report any error to the Commissioner.",["2014-12-01","2017-02-26","2023-03-12"]],["3.5","Rules Committee (inactive)","From 2015 through the 2018–19 off-season, a three-member Rules Committee elected by the League for one-year terms beginning December 1 reviewed recommendations, with the Commissioner holding the final word. The committee did not rule on trades. It was discontinued beginning with the 2019–20 off-season, when recommendations moved to open league discussion under §3.2.",["2015-08-22","2015-08-23","2017-10-28","2019-11-01"]]]},{"n":"IV","t":"The League Year","s":[["4.1","Season designation","Each off-season belongs to the season that follows it. A trade made from December 1 through the keeper deadline is a trade of the following season (for example, December 1, 2025 to March 2026 is the 2026 season).",[]],["4.2","Calendar","December 1 — Off-season opens; off-season trades may be submitted.\nFebruary — Annual Meeting (§4.3).\nEnd of February — Keeper deadline (§7.3); the off-season closes.\nMid-March, Sunday — Draft.\nAugust — Trade deadline (§9.7).\nSecond-to-last week of the MLB season — Championship ends (§11.4).",["2014-10-26","2015-10-04","2025-01-22","2026-03-01"]],["4.3","Annual Meeting","The League holds an Annual Meeting each February, ordinarily on the last Sunday before the keeper deadline. The agenda includes the season awards, recommendation discussions, the division draft (§11.2), and trade talks. Managers who cannot attend should be reachable by phone during the meeting.",["2015-01-18","2022-02-26","2026-02-22"]]]},{"n":"V","t":"Rosters and Lineups","s":[["5.1","Roster","Each team carries 26 roster spots: 16 starting spots and 10 bench spots. In addition each team has 5 injured-list (IL) spots and 2 minor-league (NA) spots.",["2014-01-24","2020-01-09","2021-06-19","YAHOO"]],["5.2","Starting lineup","C, 1B, 2B, 3B, SS, OF, OF, OF, Util; SP, SP, SP, RP, RP, P, P.",["2022-10-28","2022-11-25","YAHOO"]],["5.3","NA eligibility","A player may occupy an NA spot only while Yahoo lists him as NA-eligible.",["2014-01-24"]],["5.4","Minimum innings","Each team must pitch at least 30 innings per weekly matchup. A team that falls short forfeits the pitching categories for that matchup.",["2017-04-07","2022-10-28","2019-09-15","2026-09-01","YAHOO"]],["5.5","Off-season rosters","There is no roster limit during the off-season. Only the eight keepers (and NA keepers) carry into the new season.",["2014-11-28"]]]},{"n":"VI","t":"Scoring","s":[["6.1","Format","Head-to-head, by categories. Each category won is a win, each lost a loss, each tied a tie. Standings are by winning percentage.",["YAHOO"]],["6.2","Hitting categories (9)","Runs (R), Hits (H), Home Runs (HR), Runs Batted In (RBI), Stolen Bases (SB), Walks (BB), Strikeouts (K, fewer is better), Batting Average (AVG), On-Base Percentage (OBP).",["YAHOO"]],["6.3","Pitching categories (9)","Wins (W), Hits allowed (H), Walks allowed (BB), Strikeouts (K), ERA, WHIP, Strikeouts per nine innings (K/9), Blown Saves (BSV), Saves plus Holds (SV+H). Hits, walks, ERA, WHIP and blown saves are scored low.",["2022-08-21","YAHOO"]]]},{"n":"VII","t":"Keepers","s":[["7.1","Number","Each team keeps eight (8) players from its roster into the new season.",["2012-10-03","2013-10-01"]],["7.2","NA keepers","In addition to the eight keepers, a team may keep up to two (2) minor-league-eligible players, defined as 151 or fewer major-league at-bats and 51 or fewer major-league innings pitched. NA keepers occupy the team’s 25th- and 26th-round picks. A team that keeps fewer than two uses the open round(s) in the draft.",["2020-01-09","2021-02-05","2022-08-20","2023-02-26","2023-06-19"]],["7.3","Deadline","Keepers are due to the Commissioner by 11:59 p.m. Central on the last day of February (midnight beginning March 1), unless the Commissioner announces a different deadline. Keepers are sent to the Commissioner by text or Facebook message with each player’s full name, and NA keepers designated as such.",["2015-02-26","2021-02-22","2024-02-28","2025-02-28"]],["7.4","Early submission","A manager may submit keepers at any time before the deadline. Submitting keepers ends that manager’s off-season: he may make no further off-season trades.",["2013-02-14","2014-02-01","2015-02-06"]],["7.5","Failure to submit","If a manager has not submitted keepers by the deadline, the Commissioner sets that team’s keepers as the eight highest-ranked players on its roster by Yahoo’s O-Rank.",["2013-02-24","2014-02-19","2017-02-26"]],["7.6","Changing a keeper","Once submitted, a keeper may be replaced only if he suffers a significant injury, is suspended, retires, or meets a similar unexpected circumstance. The replacement must be requested before the draft, by the time the Commissioner sets on draft day. No keeper may be changed after the draft.",["2013-02-24","2014-03-06","2016-02-14"]]]},{"n":"VIII","t":"The Draft","s":[["8.1","Format","A live snake draft on Yahoo, held on a Sunday evening in mid-March, with one minute per pick. Keepers fill rounds 1 through 8, so the League’s first live round is the 9th.",["2013-10-01","2014-11-28","2026-03-01","YAHOO"]],["8.2","Rounds","The draft runs 26 rounds. Rounds 25 and 26 are reserved for NA keepers (§7.2) and may not be traded.",["2020-01-09","2022-07-31","2023-06-19"]],["8.3","Draft order","Draft order is the reverse of final regular-season winning percentage across all twelve teams, regardless of division titles or postseason results. The team with the worst record picks first.",["2012-08-26","2023-03-12"]],["8.4","Draft lottery (repealed)","A weighted lottery among non-playoff teams, with bonus chances for the top three consolation finishers, was adopted by league vote in February 2018 and used for the 2019 draft. It was repealed in 2019 and replaced by the consolation champion’s division pick (§11.5).",["2018-02-02","2018-09-10","2019-08-06"]]]},{"n":"IX","t":"Trades","s":[["9.1","What may be traded","Players and draft picks may be traded. A player may be traded in the off-season only if he was on the team’s final roster. Trades may involve any number of teams.",["2012-10-03","2013-10-01","2015-10-04"]],["9.2","Draft picks","Picks in the next two drafts may be traded. Each side of a trade must receive the same number of draft picks it gives up. Rounds 25 and 26 may not be traded (§8.2).",["2014-11-28","2015-10-04","2019-07-22","2020-12-23"]],["9.3","Off-season trades","From December 1 until his keeper submission, a manager may trade by agreement with another manager. Both managers (every manager, in a multi-team trade) must send the Commissioner the exact same trade, naming each draft pick by round and pick number. The trade becomes official when the Commissioner posts it to the Facebook group and updates the off-season rosters and draft boards.",["2012-10-03","2013-10-01","2014-11-28","2022-11-25"]],["9.4","Entering off-season pick trades","Off-season trades of picks in the current draft are entered on Yahoo before the draft. Off-season trades of picks in the following year’s draft are re-entered on Yahoo after the draft, once that draft board opens.",["2013-02-14","2023-03-13","2026-03-17"]],["9.5","In-season trades","In-season trades are made on Yahoo.",["YAHOO"]],["9.6","Veto","Any manager may vote on Yahoo to veto an accepted in-season trade within one day. Seven (7) veto votes reject the trade. A trade that does not reach seven votes processes automatically.",["2023-03-13","YAHOO"]],["9.7","Trade deadline","The in-season trade deadline falls in August on the date the Commissioner sets on Yahoo (August 6 in 2026).",["2012-08-12","2024-07-29","2026-08-03","YAHOO"]],["9.8","Negotiation courtesy","A manager who declines an offer should say why, or counter it, so the other manager knows whether to try again.",["2014-07-21"]]]},{"n":"X","t":"Transactions","s":[["10.1","Free agents and waivers","Free agents may be added at any time, with no limit on acquisitions per week or per season. Dropped players clear waivers in two days; waiver priority is a continual rolling list.",["YAHOO"]],["10.2","Lineup timing","Lineup changes take effect the same day (Yahoo “Daily – Today”): a player may be started until his game begins.",["2018-05-13","YAHOO"]],["10.3","Mistakes","Each manager is responsible for his own transactions. A roster move made in error stands.",["2017-08-15"]]]},{"n":"XI","t":"Divisions, Schedule and Postseason","s":[["11.1","Divisions","The League plays in three divisions of four teams, redrawn every year.",["2014-01-25","2014-01-26"]],["11.2","Division draft","At the Annual Meeting the previous season’s champion, runner-up and third-place finisher each lead a division and draft its members in that order, snaking, for three rounds. Each leader names his division.",["2014-09-28","2015-10-04","2021-02-05","2023-02-27","2026-09-21"]],["11.3","Schedule","Each team plays its three division opponents four times each and every other team at least once; the remaining weeks are additional non-division matchups. The All-Star break week is combined with the next week into a single matchup.",["2014-01-28","2016-07-10","2022-03-11","2025-01-22"]],["11.4","Playoffs","Six teams qualify. The three division winners receive the top three seeds; the remaining three spots go to the best records. The top two seeds receive a first-round bye, and teams are reseeded after each round. The playoffs run three weeks, ending with the championship in the second-to-last week of the MLB season. A third-place game is played.",["2012-08-26","2016-09-12","2021-09-12","2025-01-22","2026-03-01","YAHOO"]],["11.5","Consolation tournament","The six non-playoff teams play a consolation tournament. The consolation champion chooses which division he joins for the next season, taking his place at the start of the third round of the division draft in place of the third-round pick of the division he chooses.",["2019-08-06","2021-02-05","2021-09-12"]],["11.6","Tiebreaker","A tied playoff or consolation matchup is decided by the regular-season results between the two teams, counted in total categories won. If still tied, the higher seed advances.",["2022-09-25","2026-09-07","YAHOO"]],["11.7","Honors","The champion receives the S&F championship banner.",["2019-03-17","2022-02-27"]]]},{"n":"XII","t":"Conduct","s":[["12.1","Sportsmanship","Trash talk is welcome. Personal put-downs are not. Once a rule is applied or a vote is decided, managers accept the result and move on.",["2014-07-31"]]]},{"n":"XIII","t":"Interrupted Seasons","s":[["13.1","Shortened MLB seasons","When MLB cancels games, the League cancels the fantasy matchups covering the same dates.",["2022-03-06"]],["13.2","Cancelled seasons","If a season cannot be played, rosters and draft boards carry over unchanged into the next off-season. The 2020 season was cancelled under this rule; the 2020 draft was never held, and any 2020 games played were an unofficial redraft.",["2020-03-12","2020-07-04","2020-07-19"]]]}],"history":[["2012-08-26","Top six teams make the playoffs; draft order set by regular-season winning percentage, not postseason finish."],["2012-10-03","Off-season trading established: 8 keepers; players on final rosters and draft picks tradable; both managers report the trade to the Commissioner; multi-team trades allowed."],["2013-02-14","Early keeper submission permitted; submitting ends a manager’s off-season."],["2013-02-24","Keeper injury replacement allowed before the draft; unsubmitted keepers default to top 8 by Yahoo O-Rank."],["2013-10-01","Off-season opens December 1."],["2014-01-24","Two NA roster spots added."],["2014-01-25","League votes 6–5 to redraw divisions; three divisions of four."],["2014-01-28","League votes to play division opponents four times."],["2014-02-05","Challenge Option adopted for in-season trades: two challenges per manager per season; seven votes to veto; vetoed trade may not be re-offered without change."],["2014-09-28","Top three finishers pick the next season’s divisions."],["2014-11-28","Draft picks must be traded in equal numbers; no off-season roster limit."],["2015-02-01","Challenge limit dropped; protests filed privately through Yahoo, seven protests to veto."],["2015-08-22","Rules Committee created (three elected members, Commissioner chairs)."],["2017-03-15","Trades process automatically after 24 hours unless seven written protests are received."],["2017-04-07","Weekly minimum of 21 innings pitched introduced."],["2017-08-15","League vote 4–3 lets deadline trades stand after a roster-spot error; going forward roster mistakes stand."],["2018-02-02","Draft lottery for non-playoff teams adopted by league vote."],["2018-05-13","Same-day (“Daily – Today”) lineup changes put to a league vote; now the league setting."],["2018-12-16","Retention vote for three straight bottom-three finishes proposed (Recommendation No. 5); later invoked as league rule."],["2019-08-06","Draft lottery repealed; consolation champion picks his division."],["2019-11-01","Rules Committee discontinued; recommendations decided by league discussion and the Commissioner."],["2020-01-09","Roster expanded to 26; round 26 not tradable. One NA keeper allowed in round 26. Trade veto changed to a private league vote, majority (six) to veto."],["2020-03-12","League votes to suspend the draft; the 2020 season is later cancelled."],["2020-12-23","2023 draft board opened for trading during the 2021 off-season."],["2021-02-05","NA keeper defined as minor-league eligible (150 AB / 50 IP or fewer)."],["2021-02-21","Co-manager rules issued."],["2021-06-19","League votes to expand IL spots beyond three."],["2021-09-13","First retention vote held; manager retained 7–3."],["2022-02-24","Money-league proposal falls short (7–4); league stays free."],["2022-08-20","Second NA keeper approved, effective 2023–24 off-season; rounds 25–26 reserved."],["2022-08-21","Wins retained as a category; Quality Starts not adopted."],["2022-10-28","Innings minimum raised to 30; one RP starting spot removed (SP-SP-SP-RP-RP-P-P)."],["2023-02-26","NA eligibility restated as 151 or fewer AB and 51 or fewer IP."],["2023-03-13","Veto moved to Yahoo league votes: seven votes within one day."],["2025-01-22","Playoffs moved up one week; championship ends the second-to-last MLB week."],["2026-09-07","Tiebreaker clarified: total categories won head-to-head, then higher seed."]],"src":{"2012-04-12":"430645490284611","2014-07-31":"916561655026323","2022-02-19":"5961869003828871","2022-02-24":"5981095741906197","2013-10-01":"725716254110865","2015-01-21":"1032227966793024","2024-12-26":"23994084593514036","2014-07-21":"910459608969861","2024-07-29":"9186488398033566","2015-10-04":"1189661447716341","2016-10-03":"1516178011731348","2018-12-16":"2501473246535148","2021-09-13":"5387355544613556","2023-03-29":"7207769389238820","2023-10-02":"7872275102788242","2024-03-02":"8466902079992205","2024-10-09":"9736075543074846","2021-02-21":"4753215288027588","2019-11-01":"3095545550461245","2022-07-20":"6412198198795947","2014-12-01":"995279540487867","2017-02-26":"1684579381557876","2023-03-12":"7156758591006567","2015-08-22":"1164765136872639","2015-08-23":"1165413576807795","2017-10-28":"1962050730477405","2014-10-26":"969998469682641","2025-01-22":"24139623335626827","2026-03-01":"27471182142470913","2015-01-18":"1030786893603798","2022-02-26":"5987002764648828","2026-02-22":"27407251145530680","2014-01-24":"7978 function vRules(){
  const R = RULES, FB = "https://www.facebook.com/groups/430643753618118/posts/";
  const fmt = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd).toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"}); };
  const cite = ss => ss.length ? `<div class="cite"><span>Source:</span>${ss.map(d => d === "YAHOO" ? `<a ${ext(L.links.yahoo)}>Yahoo league settings, 2026</a>` : `<a ${ext(FB + R.src[d] + "/")}>${fmt(d)}</a>`).join("")}</div>` : "";
