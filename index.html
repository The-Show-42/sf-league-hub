<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S&amp;F Baseball Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy scoreboard masthead with gold rule and section tabs; each section is a full-width "card stock" panel; team colors carry identity. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d9dee6;
  --ink:#0f1b2d; --muted:#5b6778; --navy:#0b1f3a; --navy-2:#132b4d; --navy-ink:#ffffff; --navy-muted:#aeb9c8;
  --gold:#f2a516; --gold-ink:#1b1300; --sel:#fff4d6; --sel-line:#f2a516; --good:#2e7d32;
  --t1:#1b5e20; --t1-ink:#ffffff; --t2:#43a047; --t2-ink:#ffffff; --t3:#a5d6a7; --t3-ink:#10301a; --t4:#e8f5e9; --t4-ink:#10301a; --nr:#9aa3af;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a121e; --surface:#121d2d; --surface-2:#18263a; --line:#26364d;
  --ink:#e8edf4; --muted:#93a0b3; --navy:#050d19; --navy-2:#0e1c30; --navy-ink:#ffffff; --navy-muted:#8f9cb0;
  --gold:#f5b335; --gold-ink:#1b1300; --sel:#2e2610; --sel-line:#f5b335; --good:#66bb6a;
  --t1:#2e7d32; --t1-ink:#ffffff; --t2:#3f8f44; --t2-ink:#ffffff; --t3:#2a5a33; --t3-ink:#d9f2dc; --t4:#1b3322; --t4-ink:#cfe9d3; --nr:#6b7686;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a121e; --surface:#121d2d; --surface-2:#18263a; --line:#26364d;
  --ink:#e8edf4; --muted:#93a0b3; --navy:#050d19; --navy-2:#0e1c30; --navy-ink:#ffffff; --navy-muted:#8f9cb0;
  --gold:#f5b335; --gold-ink:#1b1300; --sel:#2e2610; --sel-line:#f5b335; --good:#66bb6a;
  --t1:#2e7d32; --t1-ink:#ffffff; --t2:#3f8f44; --t2-ink:#ffffff; --t3:#2a5a33; --t3-ink:#d9f2dc; --t4:#1b3322; --t4-ink:#cfe9d3; --nr:#6b7686;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;margin:0}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--navy);color:var(--navy-ink)}
.mast .top{padding-block:16px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px}
.eyebrow{font-family:var(--font-display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--gold);margin:0}
.brand{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1;margin:2px 0 0;letter-spacing:.01em;text-transform:uppercase}
.status{font-size:13px;color:var(--navy-muted);display:flex;align-items:center;gap:8px;margin:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--navy-muted);flex:none}
.dot.live{background:#4cd964}
.tabs{background:var(--navy-2);border-bottom:4px solid var(--gold)}
.tabs nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs nav::-webkit-scrollbar{display:none}
.tabs a{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--navy-muted);padding:11px 10px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-4px}
.tabs a:hover{color:#fff}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#fff}
main{padding-block:18px 32px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin-bottom:12px}
h1,h2,h3{text-wrap:balance}
.sec-head h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,4vw,34px);text-transform:uppercase;margin:0;line-height:1}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.panel-h{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;z-index:1;background:var(--surface-2);font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.l,td.l{text-align:left}
thead th:first-child,td:first-child{padding-left:14px}
td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;white-space:nowrap}
td.name{white-space:normal;font-weight:600;text-align:left}
td.name span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
td.rk{font-family:var(--font-display);font-weight:700;font-size:16px;width:52px}
.k1{background:var(--t1);color:var(--t1-ink)} .k2{background:var(--t2);color:var(--t2-ink)} .k3{background:var(--t3);color:var(--t3-ink)} .k4{background:var(--t4);color:var(--t4-ink)} .kn{color:var(--nr);font-weight:600!important}
.group th{background:var(--surface);padding:12px 6px 6px 14px;text-align:left;border-bottom:2px solid var(--team,var(--gold));font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff;background:var(--team,#555);white-space:nowrap;text-decoration:none}
a.tag:hover{filter:brightness(1.15)}
.avail{font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
select,input[type=search]{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:42px;max-width:100%}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible,tr:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label.f{display:grid;gap:4px;font-family:var(--font-display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;border:0;background:none;color:var(--muted);padding:9px 14px;min-height:42px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
.filters .grow{flex:1 1 220px}
.filters .grow input{width:100%}
.count{font-size:13px;color:var(--muted);margin:0 0 8px}

/* Home */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px}
.hero .panel{padding:16px}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,3.6vw,34px);text-transform:uppercase;margin:0 0 6px;line-height:1.05}
.hero p{margin:0 0 10px;color:var(--muted);max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{padding:10px;text-align:center;border-right:1px solid var(--line)}
.facts div:last-child{border-right:0}
.facts dt{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1}
.jump{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jump a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.jump a:hover{border-color:var(--gold)}
.jump b{display:block;font-family:var(--font-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.jump span{font-size:13px;color:var(--muted)}
.dir td.team{text-align:left;white-space:normal}
.dir td.team a{font-weight:700;text-decoration:none}
.dir td.team a:hover{text-decoration:underline}
.dir td.team span{display:block;font-size:12px;color:var(--muted)}
.swatch{display:inline-block;width:10px;height:28px;border-radius:3px;background:var(--team);vertical-align:middle}

/* League rosters */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.rcard header{background:var(--team);color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rcard header a{font-family:var(--font-display);font-weight:800;font-size:20px;text-transform:uppercase;text-decoration:none;color:#fff;line-height:1.1}
.rcard header a:hover{text-decoration:underline}
.rcard header span{font-size:12px;opacity:.9;white-space:nowrap}
.rcard h4{margin:0;padding:8px 12px 4px;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rcard ol{list-style:none;margin:0;padding:0 0 6px}
.rcard li{display:grid;grid-template-columns:1fr auto 40px;gap:8px;align-items:center;padding:3px 12px;font-size:14px}
.rcard li .pos{font-size:12px;color:var(--muted)}
.rcard li .r{font-family:var(--font-display);font-weight:700;font-size:14px;text-align:center;border-radius:4px;padding:1px 0;font-variant-numeric:tabular-nums}

/* Team page */
.teamhead{background:var(--team);color:#fff;border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.teamhead h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,44px);text-transform:uppercase;margin:0;line-height:1}
.teamhead p{margin:4px 0 0;opacity:.92}
.teamhead select{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4)}
.teamhead select option{color:#0f1b2d;background:#fff}
.stats{display:grid;grid-template-columns:repeat(6,1fr);margin:0}
.stats div{padding:10px 6px;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats dt{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:2px 0 0;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.stats dd small{font-size:13px;color:var(--muted);font-weight:600}
.picks{padding:10px 14px 4px;display:grid;gap:8px}
.picks h3{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font:inherit;font-family:var(--font-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line)}
.chip .orig{color:var(--muted);font-weight:500}
.none{color:var(--muted);font-size:14px}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Trade compare */
.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:8px}
.controls select{width:100%}
.swap{min-height:42px;min-width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font-size:18px;cursor:pointer}
.finder{position:relative;margin-bottom:10px}
.finder input{width:100%}
.results{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);margin:4px 0 0;padding:4px;list-style:none;max-height:340px;overflow:auto}
.results button{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .meta{font-size:12px;color:var(--muted)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.side{display:flex;flex-direction:column}
.side-head{background:var(--team);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.side-head h2{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;margin:0;text-transform:uppercase}
.side-head p{margin:3px 0 0;font-size:13px;opacity:.9}
.side-head .slot{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.side .stats{grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.side .picks{border-bottom:1px solid var(--line)}
.side .roster{overflow:auto;max-height:560px}
tbody tr.p{cursor:pointer}
tbody tr.p:hover td:not(.rk){background:var(--surface-2)}
tr[aria-pressed="true"] td:not(.rk){background:var(--sel)}
tr[aria-pressed="true"] td.name{box-shadow:inset 4px 0 0 var(--sel-line)}
.builder{border-top:4px solid var(--gold)}
.builder-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.builder-head h2{font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0}
.builder-head p{margin:0;font-size:13px;color:var(--muted)}
.clear{font:inherit;font-weight:600;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer}
.slip{display:grid;grid-template-columns:1fr 1fr}
.slip>div{padding:12px 14px;min-width:0}
.slip>div+div{border-left:1px solid var(--line)}
.slip h3{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.slip ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
.slip li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px;background:var(--surface-2);border-radius:6px;padding:5px 6px 5px 10px}
.slip li b{font-weight:600}
.slip li span{color:var(--muted);font-size:12px}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;min-width:28px;min-height:28px;border-radius:6px}
.x:hover{color:var(--ink);background:var(--line)}
.tot{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:2px 10px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.tot b{color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.empty{padding:16px 14px;color:var(--muted);font-size:14px;margin:0}

/* Draft boards */
.board td.cell{color:#fff;background:var(--team);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;min-width:74px;border:2px solid var(--surface)}
.board td.cell.traded{box-shadow:inset 0 -4px 0 rgba(255,255,255,.55)}
.board th.col{min-width:74px;line-height:1.15}
.board th.col small{display:block;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:none;font-size:11px}
.board td.rd{font-family:var(--font-display);font-weight:700;text-align:left;white-space:nowrap}
.board td.rd small{color:var(--muted);font-weight:600;margin-left:4px}
.band{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:9px 14px;border-bottom:1px solid var(--line)}
.own td{font-size:14px}
.own td.cap{font-family:var(--font-display);font-weight:700;font-size:17px}

/* Trade log */
.trade{padding:12px 14px;border-bottom:1px solid var(--line)}
.trade:last-child{border-bottom:0}
.trade h3{margin:0 0 6px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.trade h3 span{color:var(--muted);font-weight:600;margin-left:8px}
.trade ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.trade li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.trade li b{font-weight:600;margin-right:4px}
.foot{font-size:12px;color:var(--muted);margin:14px 0 0;max-width:90ch}

/* Masthead brand */
.brandlink{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;min-width:0}
.logo{height:60px;width:auto;border-radius:6px;display:block;flex:none;background:#fff}
.brandlink .eyebrow,.brandlink .brand{display:block}

/* Managers */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:120px 1fr;min-width:0;border-top:5px solid var(--team)}
.mcard img{width:120px;height:100%;min-height:150px;object-fit:cover;display:block;background:var(--surface-2)}
.mcard .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mcard h2{font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase;margin:0;line-height:1}
.mcard h2 a{text-decoration:none}
.mcard h2 a:hover{text-decoration:underline}
.mcard .team{font-size:13px;color:var(--muted);margin:0}
.mcard p.bio{margin:0;font-size:14px}
.mline{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.pill{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.mlinks{display:flex;gap:12px;font-size:13px;font-weight:600}
.mlinks a{color:var(--muted)}
.mlinks a:hover{color:var(--ink)}
.former{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0}
.former div{padding:10px 14px;border-bottom:1px solid var(--line)}
.former b{display:block;font-family:var(--font-display);font-size:17px;font-weight:700}
.former span{font-size:14px;color:var(--muted)}
.mhead{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--team);border-radius:12px;overflow:hidden;margin-bottom:12px}
.mhead img{width:180px;height:100%;min-height:180px;object-fit:cover;display:block}
.mhead .body{padding:14px 16px 14px 0;display:flex;flex-direction:column;gap:8px}
.mhead h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,4.5vw,40px);text-transform:uppercase;margin:0;line-height:1}
.mhead p{margin:0}

/* History */
.prose{padding:16px;display:grid;gap:12px;max-width:none}
.prose p{margin:0;max-width:75ch}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0}
.champs div{padding:10px 14px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.champs .yr{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}

/* ---------- S&F value engine ---------- */
// One scale for players and picks. A player ranked r is worth 100·e^(-(r-1)/60); a draft pick is worth the

const VAL = r => r === null ? 1.2 : 100 * Math.exp(-(r - 1) / 60);

const pv28 = rd => 0.9 * 100 * Math.exp(-(((rd - 9) * 12 + 6.5) + 95) / 60);
const pval = p => 0.6 * VAL(p.dyn) + 0.4 * VAL(p.r27);

const POSG = ["C","1B","2B","3B","SS","OF","SP","RP"];
function posList(p){ const s = String(p.pos || "").split(",").map(x => x.trim()).filter(Boolean);
  if (p.type === "Pitcher") return s.filter(x => x === "SP" || x === "RP").length ? s.filter(x => x === "SP" || x === "RP") : ["SP"];
  const h = s.filter(x => POSG.includes(x)); return h.length ? h : ["DH"]; }
const isProspect = p => p.dyn !== null && p.r27 === null && (p.age === null || p.age <= 23);

// keeper plan for a list of players: 2 NA prospects, then the best 8 of everyone else
function keeperPlan(pl){
  const byV = [...pl].sort((a, b) => pval(b) - pval(a));
  const na = byV.filter(isProspect).slice(0, 2);
  const keep = byV.filter(p => !na.includes(p)).slice(0, 8);
  const rest = byV.filter(p => !na.includes(p) && !keep.includes(p));

}
function teamScore(pl, p27, p28){

  const capA = p27.reduce((s, p) => s + pv27(p), 0), capB = p28.reduce((s, p) => s + pv28(p.round), 0);
  const now = [...pl].map(p => VAL(p.r27)).sort((a, b) => b - a).slice(0, 8).reduce((s, v) => s + v, 0);
  const fut = [...pl].map(p => VAL(p.dyn)).sort((a, b) => b - a).slice(0, 10).reduce((s, v) => s + v, 0);

// league-wide scarcity: how many keeper-quality players (value 20+) are eligible at each spot
function scarcity(){
  const c = {}; POSG.forEach(x => c[x] = 0);
  cache.players.forEach(p => { if (pval(p) >= 20) posList(p).forEach(x => { if (c[x] !== undefined) c[x]++; }); });
  return c;
}
function needsOf(plan, sc){

  plan.keep.concat(plan.na).forEach(p => posList(p).forEach(x => { if (have[x] !== undefined) have[x]++; }));
  const want = {C:1, "1B":1, "2B":1, "3B":1, SS:1, OF:2, SP:2, RP:0};
  return POSG.filter(x => have[x] < want[x]).sort((a, b) => sc[a] - sc[b]).map(x => ({pos:x, have:have[x], want:want[x], pool:sc[x]}));

function leagueTable(over){

function vPlanner(){

  const kept = new Set(), surplus = {};
  lt.forEach(r => { r.s.plan.keep.concat(r.s.plan.na).forEach(p => kept.add(p.name)); surplus[r.key] = r.s.plan.rest.filter(p => pval(p) >= 12); });
  const targets = needs.slice(0, 4).map(n => ({n, list:cache.players.filter(p => p.mgr !== key && posList(p).includes(n.pos) && !kept.has(p.name)).sort((x, y) => pval(y) - pval(x)).slice(0, 5)}));
  const partners = lt.filter(r => r.key !== key).map(r => {
    const theirNeeds = needsOf(r.s.plan, sc).map(x => x.pos), myNeeds = needs.map(x => x.pos);
    const theyHave = surplus[r.key].filter(p => posList(p).some(x => myNeeds.includes(x)));
    const iHave = surplus[key].filter(p => posList(p).some(x => theirNeeds.includes(x)));
    const fit = theyHave.reduce((s, p) => s + pval(p), 0) + iHave.reduce((s, p) => s + pval(p), 0) + (theyHave.length && iHave.length ? 15 : 0);
    return {r, theyHave, iHave, theirNeeds, fit};
  }).sort((x, y) => y.fit - x.fit).slice(0, 3);
  const mode = me.nowRank <= 4 && me.nowRank <= me.futRank ? ["Contender", "Win-now rank is near the top. Trade picks and prospects for 2027 production."]
    : me.futRank <= 4 && me.futRank < me.nowRank ? ["Builder", "The future core is stronger than the 2027 roster. Hold prospects and add picks unless a deal fills a hole."]

  const opts = TEAMS.map(t => `<option value="${t.key}"${t.key === key ? " selected" : ""}>${esc(t.key)} &mdash; ${esc(t.team)}</option>`).join("");

  return `<div class="sec-head"><div><h1>Off-Season Planner</h1><p>Recommended keepers, holes to fill, players to target and the best trade partners for each team. Built from the same values as the Trade Grade, so it updates when a trade is logged.</p></div></div>
    <div class="controls"><label class="f">Team<select id="planTeam">${opts}</select></label></div>
    <section class="panel" style="--team:${T[key].color}"><div class="plan-top"><div><h2 style="margin:0">${esc(T[key].team)}</h2><p style="margin:2px 0 0;color:var(--muted)">${esc(T[key].owner)}</p></div>
      <div class="mode"><span class="pill gold">${mode[0]}</span><p>${mode[1]}</p></div></div>
      <dl class="facts five"><div><dt>Power rank</dt><dd>#${me.rank}</dd></div><div><dt>Win-now rank</dt><dd>#${me.nowRank}</dd></div><div><dt>Future rank</dt><dd>#${me.futRank}</dd></div><div><dt>Team score</dt><dd>${r1(me.s.total)}</dd></div><div><dt>Draft capital</dt><dd>${r1(me.s.capA + me.s.capB)}</dd></div></dl></section>
    <div class="plan-grid">
      <section class="panel"><h2 class="panel-h">Recommended keepers &middot; 8</h2><div class="scroll">${ptable(plan.keep, "No players.")}</div>
        <h2 class="panel-h">NA keepers &middot; 2</h2><div class="scroll">${ptable(plan.na, "No ranked prospects without a 2027 rank.")}</div>
        <p class="foot">NA picks are the top dynasty-ranked players age 23 or under with no 2027 rank, the usual NA-eligible prospects. Confirm each one's NA status in Yahoo before keeper day.</p></section>
      <section class="panel"><h2 class="panel-h">Keeper holes, scarcest first</h2>
        ${needs.length ? `<ul class="needs">${needs.map(n => `<li><b>${n.pos}</b> keepers: ${n.have} of ${n.want} &middot; ${n.pool} keeper-quality ${n.pos} in the league</li>`).join("")}</ul>` : `<p class="empty">Every spot is covered by the keepers.</p>`}

        <h2 class="panel-h">Trade chips &middot; useful players outside the top 8</h2><div class="scroll">${ptable(surplus[key].slice(0, 8), "No surplus players worth 12+.")}</div></section>

riginal member of the league. Known as \"Sexy,\" he is a two-time league champion. The only man to go first to worst in back-to-back years. Favorite terms: \"Talk to me when you're serious\" & \"Ha, not! Lmfao\".","Doug":"The Big Red Machine has been a member since 2010. He loves to play and trade, often trading for prominent prospects in hopes of significant returns—a big lover of Relief Pitchers. Has the title of \"Worst Trade Offers\".","Carter":"The youngest member of the league, he joined in 2011 as a 14-year-old. Arch nemesis to John Stonebarger.","Morgan":"Nicknamed \"Big Sweata,\" this man has been a league member since 2011. Made multiple playoff appearances—Andruw Jones Hall of Fame advocate. He hates Starting Pitchers so much he released them all!","Guy":"He goes by \"G Money\" and has been a member since 2011. He is very active but has taken the title of \"Hardest to trade with.\" He is a one-time league champion.","Travis":"Known as \"TravDaddy,\" he has been a member since 2013. He is one of the best managers in the league, winning three championships. A big believer in a strong pitching staff.","Preston":"He has been a member since 2013. One of two out-of-state managers residing in Oregon. He won his first championship in 2022, with more to come. The creator of MATL.","Micah":"Nicknamed \"Big Mike,\" he is a huge baseball fan and loves fantasy baseball. He makes the trades that send managers to call him ignorant, then wins the league. 2018 League Champion.","Paul":"Residing in Oregon, Paul joined the league as of 2024, taking over for a team in Week 20. This man eats and breathes baseball, hardly missing a Brewers game. You can find him listening to a fantasy baseball podcast or playing MLB The Show. GOAT PAUL"},"fb":{"Show":"benshowler","Mosby":"jacob.mosby","Justin":"justin.stonebarger","John":"jcstonebarger","Doug":"Douglas.Simmons.80","Carter":"brettman09","Morgan":"brett.morgan.37","Guy":"guy.c.swift","Travis":"Travdaddy420","Preston":"preston.devine","Micah":"micahwade121110","Paul":"paul.hilbun.1"},"former":[["Trent Ellick","An original member in 2009, he stepped away until 2014, when he returned to play an important role until 2024. He then stepped away to finish his nursing schooling."],["Cal Swift","Managed the \"Team Goons\" for five seasons, starting in 2011. He was the original owner of Mike Trout."],["Bryson Atkins","He managed for a brief period in 2014."],["Carter Barless","He managed for the beginning months of 2014."],["T.L. Murdock","He managed a team in the 2012 season called the \"Tomahawk Braves.\""],["Waterboy","He managed a team for two seasons in 2011-12 called the \"Waterboy Twins.\""],["Kimberly Morgan","She managed a team in the 2011 season called \"Cardinals Girl.\""],["Tyler Olden","He managed a team for four seasons from 2010-13. The team name was \"Red Shirt All-Stars.\" Massive fan of baseball and the Texas Rangers."],["Josh \"Pete\" England","He managed for a year and a half from 2010-11. His team name was \"petes punishers.\""],["Tommy Kinzer","He managed for 1 season in 2010."],["Bob \"Pops\" Showler","One of the originals and the reason the league was named \"Showler & Friends,\" Pop's managed for three seasons from 2009-11. Known around the league as \"No trade Pops,\" he never made one trade the whole time he played. Finished runner-up in the first year of the league."],["Hazen Hale","One of the originals, he managed for two seasons from 2009-10. His team name was \"Bravesfan.\""],["Wesley Schrick","One of the originals, he managed a team for two seasons from 2009-10. His team was named \"the schricks.\""],["Zach Randolph","One of the originals, he managed for two seasons from 2009-10. His team name was \"smallz,\" owning the first season's best record."],["Chad Scheilz","One of the originals, he managed for 1 season in 2009. His team name was the \"Oklahoma Chadaliacs.\""],["Zach Michel","One of the originals, he managed for 1 season in 2009. His team name was the \"Zichel.\""],["Kent Israel","One of the originals, he managed for 1 season in 2009. His team name was \"Izzy's Elite Team.\""]],"history":["The Showler and Friends Fantasy Baseball League was created in 2009. It started as a casual, fun league with friends; it quickly evolved into a competitive keeper league. Beginning with six keepers going into the 2010 season, each manager now keeps eight players from their squad, which started in 2011.","Most of the league's managers are from Oklahoma, with two residing in Oregon. The league does not play for money but rather the right to boast in whatever way the manager feels the need.","This league uses Yahoo Fantasy Baseball, which the commish found as the best site for fantasy sports. From the league opening date in late January to the close in October, the league uses the Yahoo site to play the game. The league, however, doesn't stop there. Starting December 1st, the managers will take their final rosters and prepare for the Off-Season. During the Off-Season, managers may trade from their final roster and draft picks in the next year's draft. This is where the managers build their rosters and use their philosophy to prepare for the following year or years based on the players obtained.","Each year, the league holds a fantasy meeting to discuss trades, talk strategies, and hold the division draft, with the top three teams picking who will be in their division for the upcoming season. The suggestion committee will also release their rulings on the suggestions from the league."],"resources":[["ESPN Fantasy Baseball","https://www.espn.com/fantasy/baseball/"],["RotoWire","https://www.rotowire.com/baseball/"],["CBS Sports Fantasy Baseball","https://www.cbssports.com/fantasy/baseball/"],["MLB.com Fantasy","http://mlb.mlb.com/mlb/fantasy/?tcid=nav_mlb_fantasy"],["Fantasy Alarm","http://www.fantasyalarm.com/mlb/"],["FantasyRundown","http://fantasyrundown.com/"],["RotoChamp","http://rotochamp.com/"],["FOX Sports Fantasy Baseball","http://w const pct = (w,l,t) => { const g = w + l + t; return g ? ((w + t/2) / g).toFixed(3).replace(/^0/, "") : "&mdash;"; };
function career(key){
  const c = L.careers[key]; if (!c) return null;
  const s = c.seasons;
  const sum = (i) => s.reduce((a, r) => a + (r[i] || 0), 0);
  const W = sum(1), Lo = sum(2), Ti = sum(3), pW = sum(5), pL = sum(6), pT = sum(7);
  return {c, W, L:Lo, T:Ti, pW, pL, pT, pct:pct(W, Lo, Ti), ppct:pct(pW, pL, pT), first:s.length ? s[0][0] : null, last:s.length ? s[s.length - 1][0] : null, n:s.length};
}
function champYears(){
  const m = {}; Object.entries(L.careers).forEach(([k, c]) => c.champs.forEach(y => m[y] = k));
  return Object.keys(m).map(Number).sort((a,b) => b - a).map(y => [y, m[y]]);
}

function vManagers(){
  const cards = TEAMS.map(x => { const cr = career(x.key), titles = cr ? cr.c.champs.length : 0;
    return `<article class="mcard" style="--team:${x.color}">${photo(x.key)}<div class="body">

function vManager(key){

      <td>${r[5] === null ? "&mdash;" : `${r[5]}-${r[6]}-${r[7] ?? 0}`}</td><td>${finish(r)}</td></tr>`).join("");
  const h2h = c.h2h.slice().sort((a,b) => (b[1] || 0) + (b[2] || 0) - (a[1] || 0) - (a[2] || 0)).map(h => `<tr><td class="l">${tag(h[0])} <span style="color:var(--muted);font-size:13px">${esc(T[h[0]] ? T[h[0]].owner : "")}</span></td>
      <td>${h[1] === null ? "&mdash;" : `${h[1]}-${h[2]}-${h[3] ?? 0}`}</td><td class="pct">${h[1] === null ? "&mdash;" : pct(h[1], h[2] || 0, h[3] || 0)}</td>
      <td>${h[4] === null ? "&mdash;" : `${h[4]}-${h[5]}-${h[6] ?? 0}`}</td><td class="pct">${h[4] === null ? "&mdash;" : pct(h[4], h[5] || 0, h[6] || 0)}</td></tr>`).join("");
  return `<div class="mhead" style="--team:${x.color}">${photo(key)}<div class="body"><p class="eyebrow" style="color:var(--muted)">${esc(x.team)}</p><h1>${esc(x.owner)}</h1><p>${esc(L.bios[key] || "")}</p>
      <div class="mline">${c.champs.length ? `<span class="pill gold">${c.champs.length}&times; Champion: ${c.champs.join(", ")}</span>` : ""}<span class="pill">${c.playoffs.length} playoff appearances</span></div>
      <div class="mlinks"><a href="#team-${key.toLowerCase()}">Current roster &amp; picks</a>${L.fb[key] ? `<a ${ext("https://www.facebook.com/" + L.fb[key])}>Facebook</a>` : ""}<a href="#managers">All managers</a></div></div></div>
    <div class="stack">
      <section class="panel"><dl class="stats"><div><dt>Seasons</dt><dd>${cr.n}</dd></div><div><dt>Regular season</dt><dd>${cr.W}-${cr.L}-${cr.T}</dd></div><div><dt>Win %</dt><dd>${cr.pct}</dd></div>
        <div><dt>Playoff trips</dt><dd>${c.playoffs.length}</dd></div><div><dt>Playoff record</dt><dd>${cr.pW}-${cr.pL}-${cr.pT}</dd></div><div><dt>Titles</dt><dd>${c.champs.length}</dd></div></dl></section>
      <section class="panel"><h2 class="panel-h">Season by season &middot; ${cr.first === cr.last ? cr.first : cr.first + "&ndash;" + cr.last}</h2><div class="scroll"><table><thead><tr><th class="l">Season</th><th>W</th><th>L</th><th>T</th><th>Win %</th><th>Place</th><th>Playoffs W-L-T</th><th>Finish</th></tr></thead><tbody>${seasons}</tbody></table></div></section>
      <section class="panel"><h2 class="panel-h">Head to head &middot; category wins-losses-ties</h2><div class="scroll"><table><thead><tr><th class="l">Opponent</th><th>Regular season</th><th>Win %</th><th>Playoffs</th><th>Win %</th></tr></thead><tbody>${h2h}</tbody></table></div></section>
    </div>`;
}
function vHistory(){
  const cy = champYears(), counts = {};
  cy.forEach(([, k]) => counts[k] = (counts[k] || 0) + 1);
  const rows = TEAMS.map(t => ({k:t.key, cr:career(t.key)})).filter(r => r.cr).sort((a,b) => b.cr.c.champs.length - a.cr.c.champs.length || parseFloat("0" + b.cr.pct) - parseFloat("0" + a.cr.pct));
  return `<div class="sec-head"><div><h1>League History</h1><p>Showler &amp; Friends Fantasy Baseball, est. 2009.</p></div></div>
    <div class="stack">
      <section class="panel prose">${L.history.map(p => `<p>${esc(p)}</p>`).join("")}</section>
      <section class="panel"><h2 class="panel-h">Champions</h2><div class="champs">${cy.map(([y, k]) => `<div><span class="yr">${y}</span>${tag(k)}</div>`).join("")}</div>
        <div class="trophies">${Object.entries(counts).sort((a,b) => b[1] - a[1]).map(([k, n]) => `<span class="pill gold">${esc(T[k] ? T[k].owner : k)} &times;${n}</span>`).join("")}</div></section>
      <section class="panel"><h2 class="panel-h">All-time records &middot; current managers</h2><div class="scroll"><table><thead><tr><th class="l">Manager</th><th>Seasons</th><th>Regular season</th><th>Win %</th><th>Playoff trips</th><th>Playoff record</th><th>Titles</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td class="l">${tag(r.k)} <a href="#manager-${r.k.toLowerCase()}" style="font-weight:600">${esc(T[r.k].owner)}</a></td><td>${r.cr.n} <small style="color:var(--muted)">(${r.cr.first === r.cr.last ? r.cr.first : r.cr.first + "&ndash;" + r.cr.last})</small></td><td>${r.cr.W}-${r.cr.L}-${r.cr.T}</td><td class="pct">${r.cr.pct}</td><td>${r.cr.c.playoffs.length}</td><td>${r.cr.pW}-${r.cr.pL}-${r.cr.pT}</td><td class="pct">${r.cr.c.champs.length || "&mdash;"}</td></tr>`).join("")}</tbody></table></div></section>
      <p class="foot">Records are category wins, losses and ties from each manager's career sheet in the league Drive. Win % counts a tie as half a win.</p>
    </div>`;
}
function vResources(){
  const lk = L.links;
  const league = [["Yahoo league", lk.yahoo, "Rosters, matchups, standings"], ["Facebook group", lk.facebook, "League chatter and announcements"], ["League Drive folder", lk.drive, "Every league file"], ["Off-Season Rosters sheet", lk.sheet, "The master sheet this site reads"], ["Draft Boards sheet", lk.boards, "2027 and 2028 boards and pick lists"]];
  return `<div class="sec-head"><div><h1>Resources</h1><p>League links and the fantasy baseball sites managers use most.</p></div></div>
    <div class="stack"><section><h2 class="panel-h" style="padding-left:0;border:0">League</h2><div class="reslist">${league.map(([n, u, d]) => `<a ${ext(u)}><span style="color:var(--ink)">${esc(n)}<br><small style="color:var(--muted);font-weight:500">${esc(d)}</small></span><span aria-hidden="true">&#8599;</span></a>`).join("")}</div></section>
    <section><h2 class="panel-h" style="padding-left:0;border:0">Fantasy baseball</h2><div class="reslist">${L.resources.map(([n, u]) => `<a ${ext(u)}><span style="color:var(--ink)">${esc(n)}</span><span aria-hidden="true">&#8599;</span></a>`).join("")}</div></section></div>`;
}

/* ---------- router ---------- */
// In-page routing. Google Sites runs embeds in a frame where "#" links point at the Sites page itself,
// so every "#..." link is handled here instead of by the browser.
let ROUTE = (location.hash || "").slice(1).toLowerCase() || "home";
function go(h){
  ROUTE = (h || "home").toLowerCase();
  try { if (/^https?:$/.test(location.protocol) && location.hash.slice(1).toLowerCase() !== ROUTE) history.pushState(null, "", "#" + ROUTE); } catch (err) {}
  route(); window.scrollTo(0, 0);
}
function route(){
  const h = ROUTE;
  let html, active = h;
  const VIEWS = {home:vHome, rosters:vRosters, teams:vTeams, compare:vCompare, planner:vPlanner, "draft-2027":vDraft27, "draft-2028":vDraft28, rankings:vRankings, trades:vTrades, managers:vManagers, history:vHistory, records:vRecords, resources:vResources};
  if (h.startsWith("team-")) { const key = TEAMS.find(t => t.key.toLowerCase() === h.slice(5)); html = key ? vTeam(key.key) : vTeams(); active = "rosters"; }
  else if (h.startsWith("manager-")) { const key = TEAMS.find(t => t.key.toLowerCase() === h.slice(8)); html = key ? vManager(key.key) : vManagers(); active = "managers"; }
  else { html = (VIEWS[h] || vHome)(); if (h === "teams") active = "rosters"; if (!VIEWS[h]) active = "home"; }
  $("view").innerHTML = html;
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + active ? "page" : "false"));
  if (h === "rankings") fillRankings();
  if (h === "records") fillBook();
  const cur = document.querySelector('#nav a[aria-current="page"]'); if (cur) cur.scrollIntoView({block:"nearest", inline:"nearest"});
}
function rerender(keepScroll){ const y = window.scrollY; route(); if (keepScroll) window.scrollTo(0, y); }

document.addEventListener("click", e => {
  const t = e.target;
  const rm = t.closest("[data-rm]"); if (rm) { sel.delete(rm.dataset.rm); rerender(true); return; }
  if (t.closest("#clear")) { sel.clear(); rerender(true); return; }
  if (t.closest("#swap")) { [ui.teamA, ui.teamB] = [ui.teamB, ui.teamA]; rerender(true); return; }
  const rk = t.closest("[data-rk]"); if (rk) { ui.rkSet = rk.dataset.rk; document.querySelectorAll("[data-rk]").forEach(b => b.setAttribute("aria-pressed", b === rk)); fillRankings(); return; }
  const jp = t.closest("[data-jump]"); if (jp) { e.preventDefault(); const el = $(jp.dataset.jump); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const pr = t.closest("[data-compare-pair]"); if (pr) { const [x, y] = pr.dataset.comparePair.split("|"); ui.teamA = x; ui.teamB = y; sel.clear(); return; }
  const cmp = t.closest("[data-compare]"); if (cmp) { ui.teamA = cmp.dataset.compare; if (ui.teamB === ui.teamA) ui.teamB = TEAMS.find(x => x.key !== ui.teamA).key; return; }
  const hit = t.closest("[data-find]");
  if (hit) { const [owner, name] = JSON.parse(hit.dataset.find); if (ui.teamA !== owner && ui.teamB !== owner) ui.teamB = owner; rerender(true);
    const row = [...document.querySelectorAll("tr.p")].find(r => r.dataset.id === "p:" + name); if (row) { row.scrollIntoView({block:"center"}); row.focus({preventScroll:true}); } return; }
  const it = t.closest("[data-id]"); if (it && ROUTE === "compare") { const id = it.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); rerender(true); return; }
  if (!t.closest(".finder") && $("results")) $("results").hidden = true;
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("tr.p")) { e.preventDefault(); const id = e.target.dataset.id; sel.has(id) ? sel.delete(id) : sel.add(id); rerender(true); }
  if (e.key === "Escape" && $("results")) $("results").hidden = true;
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "teamA" || id === "teamB") { ui[id] = e.target.value; const other = id === "teamA" ? "teamB" : "teamA"; if (ui[other] === ui[id]) ui[other] = TEAMS.find(t => t.key !== ui[id]).key; store("hub.a", ui.teamA); store("hub.b", ui.teamB); rerender(true); }
  if (id === "bkTrade" || id === "bkEverK") { ui[id] = e.target.value; fillBook(); }
  if (id === "bkStatY") { ui.bkStatY = e.target.value; rerender(true); }
  if (id === "planTeam") { ui.plan = e.target.value; store("hub.plan", ui.plan); rerender(true); }
  if (id === "teamJump") go("team-" + e.target.value.toLowerCase());
  if (id === "rkPos") { ui.rkPos = e.target.value; fillRankings(); }
  if (id === "rkOwner") { ui.rkOwner = e.target.value; fillRankings(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "bkTradeQ" || e.target.id === "bkEverQ") { ui[e.target.id] = e.target.value; fillBook(); }
  if (e.target.id === "rkQ") { ui.rkQ = e.target.value; fillRankings(); }
  if (e.target.id === "q") { const q = norm(e.target.value.trim()), box = $("results");
    if (q.length < 2) { box.hidden = true; return; }
    const hits = cache.players.filter(p => norm(p.name).includes(q)).slice(0, 10);
    box.innerHTML = hits.length ? hits.map(p => `<li><button type="button" data-find='${esc(JSON.stringify([p.mgr, p.name]))}'><span><b>${esc(p.name)}</b> <span class="meta">${esc(p.pos)} &middot; ${esc(p.mlb)} &middot; Dyn ${p.dyn ?? "NR"}</span></span><span class="tag" style="--team:${T[p.mgr].color}">${esc(p.mgr)}</span></button></li>`).join("")
      : `<li class="empty">No rostered player matches "${esc(e.target.value)}".</li>`;
    box.hidden = false; }
});
// runs after the handlers above, so they can set state first (e.g. which teams to compare)
document.addEventListener("click", e => {
  if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  e.preventDefault(); go(a.getAttribute("href").slice(1));
});
const fromUrl = () => { const h = (location.hash || "").slice(1).toLowerCase() || "home"; if (h !== ROUTE) { ROUTE = h; route(); window.scrollTo(0, 0); } };
window.addEventListener("hashchange", fromUrl);
window.addEventListener("popstate", fromUrl);

function setStatus(live, text){ $("dot").className = "dot" + (live ? " live" : ""); $("statusText").textContent = text; }

/* ---------- live data from the league sheet (Google Sheets query feed; works on Google Sites, not inside claude.ai) ---------- */
function gviz(sheet, range){
  return new Promise((resolve, reject) => {
    const cb = "__hub" + Math.random().toString(36).slice(2), s = document.createElement("script");
    const timer = setTimeout(() => { done(); reject(new Error("timeout")); }, 15000);
    function done(){ clearTimeout(timer); try { delete window[cb]; } catch(e){ window[cb] = undefined; } s.remove(); }
    window[cb] = res => { done(); res && res.status !== "error" && res.table ? resolve(res.table) : reject(new Error("query error")); };
    s.onerror = () => { done(); reject(new Error("blocked")); };
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}&range=${range}&headers=1&tqx=out:json;responseHandler:${cb}`;
    document.head.appendChild(s);
  });
}
const cellText = c => c == null || c.v == null ? "" : (typeof c.v === "number" ? (Number.isInteger(c.v) ? c.v : (c.f ?? c.v)) : (c.f ?? String(c.v)));
const rowsOf = t => t.rows.map(r => (r.c || []).map(cellText));
async function loadLive(){
  try {
    const [pdb, dp, dyn, red, tl, home] = await Promise.all([gviz("Player Database","A1:K500"), gviz("Draft Picks","A1:Q193"), gviz("Dynasty Rankings","A1:F800"), gviz("2027 Rankings","A1:I400"), gviz("Trade Log","A4:E504"), gviz("Home","B3:B3").catch(() => null)]);
    const players = rowsOf(pdb).filter(r => r[1] && T[r[0]]);
    const picks = rowsOf(dp);
    const picks27 = picks.filter(r => r[3]).map(r => [String(r[3]), r[5], r[4]]);
    const picks28 = picks.filter(r => r[14] !== "" && r[16]).map(r => [Number(r[14]), r[15], r[16]]);
    const dynRows = rowsOf(dyn).filter(r => num(r[0]) !== null && r[1]);
    const redRows = rowsOf(red).filter(r => num(r[0]) !== null && r[1]);
    const trades = rowsOf(tl).filter(r => r[2] && r[4]).map(r => [r[0], r[1], r[2], r[3], r[4]]);
    if (players.length < 300 || picks27.length !== 192 || picks28.length !== 192 || dynRows.length < 100 || redRows.length < 100) throw new Error("incomplete");
    const redSrc = red.cols && red.cols[8] && red.cols[8].label ? red.cols[8].label : DATA.redSource;
    const status = home && home.rows && home.rows[0] && home.rows[0].c && home.rows[0].c[0] ? cellText(home.rows[0].c[0]) : (home && home.cols && home.cols[0] ? home.cols[0].label : "");
    DATA = {...DATA, players, picks27, picks28, dyn:dynRows.map(r => r.slice(0, 6)), red:redRows.map(r => r.slice(0, 6)), trades, redSource:redSrc || DATA.redSource, refreshed:status || DATA.refreshed};
    derive();
    const now = new Date().toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
    setStatus(true, "Live from the league sheet · loaded " + now);
    rerender(true);
  } catch (e) {
    setStatus(false, "Showing saved data from " + DATA.asOf + " (live sheet unavailable right now)");
  }
}

$("logo").src = PH.logo;
ui.teamA = T[store("hub.a")] ? store("hub.a") : "Show";
ui.plan = T[store("hub.plan")] ? store("hub.plan") : "Show";
ui.teamB = T[store("hub.b")] && store("hub.b") !== ui.teamA ? store("hub.b") : (ui.teamA === "Mosby" ? "Show" : "Mosby");
derive(); route();
if (LIVE) { setStatus(false, "Loading live data…"); loadLive(); }
else setStatus(false, "Rosters, ranks, picks and trades as of " + DATA.asOf);
</script>
